name: OIDC Debug

# One-off diagnostic for "Not authorized to perform sts:AssumeRoleWithWebIdentity".
# Trigger it on the exact branch/event that fails, read the `sub` it prints,
# then put that value in the role's trust policy. Delete this file afterwards.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show the OIDC token claims AWS will see
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "event_name = $EVENT_NAME"
          echo "ref        = $GITHUB_REF"
          echo "ref_name   = $GITHUB_REF_NAME"
          echo "repository = $REPOSITORY"

          TOKEN_JSON=$(curl -sS -f \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          python3 - "$TOKEN_JSON" <<'PY'
          import base64, json, sys

          token = json.loads(sys.argv[1])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("\n--- claims ---")
          for key in ("iss", "aud", "sub", "repository", "repository_owner",
                      "ref", "event_name", "job_workflow_ref"):
              if key in claims:
                  print(f"{key:18} = {claims[key]}")

          print("\n--- copy this into the trust policy StringLike ---")
          print(claims["sub"])
          PY
