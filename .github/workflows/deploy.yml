name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - dev
      - stage
      - feature/cicd_integration
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow against (main, dev, stage, feature/cicd_integration)'
        required: true
        default: 'main'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(fromJSON('["main","dev","stage","feature/cicd_integration"]'), github.ref_name)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(fromJSON('["main","dev","stage"]'), github.event.pull_request.base.ref)) ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["main","dev","stage","feature/cicd_integration"]'), github.event.inputs.branch))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || echo "No build step configured"

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy (placeholder)
        run: |
          echo "Run your deploy commands here"
          # Example: npm run deploy
          # Example ECR push / CloudFormation / Terraform commands
