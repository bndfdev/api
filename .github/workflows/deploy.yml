name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - dev
      - stage
      - feature/cicd_integration
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow against (main, dev, stage, feature/cicd_integration)'
        required: true
        default: 'main'

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bondfire-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'api' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(fromJSON('["main","dev","stage","feature/cicd_integration"]'), github.ref_name)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(fromJSON('["main","dev","stage"]'), github.event.pull_request.base.ref)) ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["main","dev","stage","feature/cicd_integration"]'), github.event.inputs.branch))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Render task definition with the new image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json
          jq --arg IMAGE "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
             --arg NAME "$ECS_CONTAINER_NAME" \
             '(.containerDefinitions[] | select(.name == $NAME) | .image) = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             task-definition.json > task-definition.rendered.json

      - name: Register task definition and update service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.rendered.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deploy ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cluster: \`${ECS_CLUSTER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${ECS_SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
