# The signed-in account (/me): profile, phone, onboarding, consents,
# interests, photos, sessions, linked logins, devices.

me:
  get:
    operationId: getMe
    tags: [Account]
    summary: Get the signed-in account
    description: |
      Called on launch after restoring tokens. `onboarding.nextStep` tells
      the app which onboarding screen to resume; `consents.termsUpToDate:
      false` means the Terms screen must be shown again. Guests get
      `accountType: guest`.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: The account.
        headers:
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '304': { $ref: '../components/responses.yaml#/NotModified' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  patch:
    operationId: updateMe
    tags: [Account]
    summary: Update the profile and account settings
    description: |
      Used by the birthday, gender and Your Profile (name) screens, and by
      Settings: Account Information (Story Translation), Location, Stories
      Language (`preferredLanguage`), Privacy > Account Privacy and Location
      Services (`locationSharing`). Saving a field completes its onboarding
      step automatically.

      - **Age gate:** a date of birth under `minimumAge` (13) is rejected
        with `AGE_REQUIREMENT_NOT_MET`; the account is flagged and the app
        must sign out and show the "not eligible" screen. The rejected date
        is not stored.
      - Age is computed on the user's local date (`device.timeZone`), so a
        birthday today counts; 29 February birthdays turn a year older on
        1 March in non-leap years.
      - Once set, date of birth can be changed only once (typo fix) within
        30 days; after that `DATE_OF_BIRTH_LOCKED` (support can change it).
      - `location` is trimmed (inner whitespace collapsed) and must then be
        1 to 100 characters with no control or zero-width characters
        (`LOCATION_INVALID`); `null` clears it.
      - Guests can set `preferredLanguage` only.

      Errors: stale `If-Match` (412), `DATE_OF_BIRTH_LOCKED` (409), `NAME_INVALID`, `DATE_OF_BIRTH_INVALID`,
      `AGE_REQUIREMENT_NOT_MET`, `LANGUAGE_UNSUPPORTED`, `LOCATION_INVALID` (422),
      `GUEST_NOT_ALLOWED` (403).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/AcceptLanguage'
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: '../components/schemas.yaml#/UserUpdate'
          examples:
            birthday:
              value: { dateOfBirth: '2000-01-12' }
            gender:
              value: { gender: non_binary }
            name:
              value: { name: Amelia Jane }
            location:
              value: { location: 'Seattle, WA' }
            privacy:
              value: { accountPrivacy: followers }
            locationSharing:
              value: { locationSharing: while_using }
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserUpdate'
    responses:
      '200':
        description: Updated account.
        headers:
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '412': { $ref: '../components/responses.yaml#/PreconditionFailed' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: deleteMe
    tags: [Account]
    summary: Delete the account
    description: |
      Required in-app by the App Store and Play Store. Needs a fresh
      `X-Reauth-Token`.

      - Accounts are soft-deleted for 30 days (`202`, `pending_deletion`),
        then all personal data and photos are erased. Signing in before
        then cancels the deletion.
      - All sessions are revoked immediately; Apple tokens are revoked with Apple.
      - Guests are deleted immediately (`204`) and need no reauth token.

      Errors: `REAUTH_REQUIRED` (401).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/ReauthToken'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AccountDeletionRequest'
    responses:
      '202':
        description: Deletion scheduled.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AccountDeletion'
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

mePassword:
  put:
    operationId: changePassword
    tags: [Account]
    summary: Change (or set a first) password
    description: |
      For accounts that already have a password, `currentPassword` is
      required. Social-only accounts set a first password by omitting
      `currentPassword` and sending `X-Reauth-Token` instead
      (`REAUTH_REQUIRED` otherwise). Other sessions are signed out unless
      `signOutOtherSessions` is `false`.

      Errors: `GUEST_NOT_ALLOWED` (403), `PASSWORD_INCORRECT`,
      `PASSWORD_POLICY_VIOLATION`, `PASSWORD_COMPROMISED`,
      `PASSWORD_REUSED` (422), `ACCOUNT_LOCKED` (423).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - name: X-Reauth-Token
        in: header
        required: false
        description: Required only when setting a first password (no `currentPassword`).
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PasswordChangeRequest'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '423': { $ref: '../components/responses.yaml#/Locked' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meEmailVerification:
  post:
    operationId: startEmailChange
    tags: [Account]
    summary: Send a code to a new email address to change the account's email
    description: |
      Change email in settings: confirm the password (`POST
      /auth/reauthenticate`), enter the new address, then enter the code
      sent to it. Verify with `POST /auth/challenges/{id}/verify` (purpose
      `change_email`, owner's access token).

      - Needs a fresh `X-Reauth-Token` (5 minutes). It is checked here only;
        resending or verifying the code does not need it.
      - The code goes to the **new** address. The account keeps its current
        email (and signs in with it) until the code is accepted; then the
        new address replaces it, stays verified, and the old address gets a
        security notice.
      - The address is normalised like at sign-up (trimmed, domain
        lowercased) and compared case-insensitively.
      - The address is not reserved while the code is pending: if another
        account takes it first, verifying returns `EMAIL_TAKEN`.
      - The account's current email returns `409 CONFLICT`, as the same
        number does for phone.
      - Calling again for the same address and install returns the **same
        challenge** (no new code) until it expires.

      Errors: `REAUTH_REQUIRED` (401, header missing, invalid or expired),
      `GUEST_NOT_ALLOWED` (403), `EMAIL_TAKEN`, `CONFLICT` (409),
      `EMAIL_INVALID`, `EMAIL_DOMAIN_NOT_ALLOWED` (422),
      `SEND_LIMIT_REACHED` (429, 5 codes per address per 24 h),
      `RATE_LIMITED` (429, 10 per account per 24 h),
      `EMAIL_DELIVERY_FAILED` (503).
    x-rate-limit:
      - { key: email, limit: 5, window: 24h }
      - { key: account, limit: 10, window: 24h }
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/ClientInstallation'
      - $ref: '../components/parameters.yaml#/AcceptLanguage'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - name: X-Reauth-Token
        in: header
        required: false
        description: |
          From `POST /auth/reauthenticate`, valid 5 minutes. Always needed
          here; declared optional so a missing token is `401
          REAUTH_REQUIRED` (the app asks for the password) rather than
          `400 MALFORMED_REQUEST`.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/EmailRequest'
          example:
            email: amelia.new@example.com
    responses:
      '202':
        description: Code sent to the new address (or an unexpired one already exists).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Challenge'
            example:
              id: chl_01J8Z9C2
              purpose: change_email
              channel: email
              destination: a•••••w@example.com
              codeLength: 6
              expiresAt: '2026-09-27T10:25:00Z'
              resendAvailableAt: '2026-09-27T10:15:30Z'
              attemptsRemaining: 5
              sendsRemaining: 4
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401':
        description: Missing or expired access token, or no valid reauth token.
        headers:
          WWW-Authenticate:
            description: '`Bearer error="invalid_token"` when a token was sent.'
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
            example:
              type: https://api.bondfire.app/errors/reauth-required
              title: Confirm your password
              status: 401
              code: REAUTH_REQUIRED
              detail: Enter your password again to change your email.
              requestId: req_01J8Z3K5QH
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
      '503': { $ref: '../components/responses.yaml#/ServiceUnavailable' }

mePhoneVerification:
  post:
    operationId: startPhoneVerification
    tags: [Account]
    summary: Send an SMS code to add or change the phone number
    description: |
      Enter your phone number screen (Figma 1261:31662) → Enter the code we
      texted you (1261:31680). Verify with `POST /auth/challenges/{id}/verify`.

      - The number is parsed and normalised to E.164 (libphonenumber) using
        the country picked in the app; the verified number replaces any
        previous one only after the code is accepted.
      - Only regions with `phoneSignupSupported: true` in `GET /countries`.
      - Premium-rate and (optionally) VoIP numbers are refused to stop SMS
        fraud (`PHONE_TYPE_NOT_ALLOWED`); sends are also limited per
        country prefix.
      - The same number already verified on this account returns `409 CONFLICT`.

      Errors: `GUEST_NOT_ALLOWED` (403), `PHONE_TAKEN`, `CONFLICT` (409),
      `PHONE_INVALID`, `PHONE_REGION_UNSUPPORTED`,
      `PHONE_TYPE_NOT_ALLOWED` (422), `SEND_LIMIT_REACHED` (429),
      `SMS_DELIVERY_FAILED` (503).
    x-rate-limit:
      - { key: phone, limit: 5, window: 24h }
      - { key: account, limit: 10, window: 24h }
      - { key: country-prefix, limit: 1000, window: 1h }
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/ClientInstallation'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phoneNumber]
            additionalProperties: false
            properties:
              phoneNumber:
                $ref: '../components/schemas.yaml#/PhoneNumber'
              channel:
                type: string
                enum: [sms]
                default: sms
                description: Reserved for WhatsApp or voice later.
    responses:
      '202':
        description: Code sent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Challenge'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
      '503': { $ref: '../components/responses.yaml#/ServiceUnavailable' }

mePhone:
  delete:
    operationId: removePhone
    tags: [Account]
    summary: Remove the phone number
    description: Idempotent. When `/config` → `features.phoneVerificationRequired` is on, the `phone_verified` onboarding step returns to pending.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meOnboarding:
  get:
    operationId: getOnboarding
    tags: [Onboarding]
    summary: Get onboarding progress
    description: Same object as `User.onboarding`; cheap to poll.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Progress.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Onboarding'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meOnboardingStep:
  put:
    operationId: updateOnboardingStep
    tags: [Onboarding]
    summary: Mark an onboarding step completed or skipped
    description: |
      Data steps (`email_verified`, `password_set`, `phone_verified`,
      `date_of_birth`, `terms_accepted`, `gender`) complete themselves when
      their data is saved; marking them `completed` without the data is
      `ONBOARDING_STEP_INVALID`. `interests` and `profile` can be `skipped`
      ("Later" on Set up profile) or `completed` explicitly. Idempotent.

      Errors: `ONBOARDING_STEP_INVALID`, `ONBOARDING_STEP_NOT_SKIPPABLE` (422).
    parameters:
      - $ref: '../components/parameters.yaml#/OnboardingStep'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/OnboardingStepUpdate'
    responses:
      '200':
        description: Updated progress.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Onboarding'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meConsents:
  get:
    operationId: listConsents
    tags: [Legal]
    summary: List accepted legal documents
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Consent history, newest first.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ConsentList'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  post:
    operationId: acceptLegalDocument
    tags: [Legal]
    summary: Record that the user accepted a legal document
    description: |
      "Accept" on Terms and Conditions (Figma 1270:11938). Stores the
      version, time, IP and install for audit. Accepting the same version
      again returns the existing record (`200`). "Decline" sends nothing:
      the app signs out and returns to Welcome.

      Errors: `LEGAL_DOCUMENT_NOT_FOUND` (404), `LEGAL_VERSION_OUTDATED`
      (409, `meta.currentVersion`; the app reloads the document and asks again).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/ClientInstallation'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ConsentRequest'
          example:
            documentType: terms
            version: '2026-09-01'
            accepted: true
    responses:
      '200':
        description: Already accepted; existing record.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Consent'
      '201':
        description: Recorded.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Consent'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meInterests:
  get:
    operationId: getMyInterests
    tags: [Interests]
    summary: Get the user's selected interests
    description: |
      In the order chosen. Each item carries `followedAt`, when it was first
      followed (`null` for selections saved before that was recorded). For
      Settings > Your Interests sorted by follow time, use
      `GET /interests/search?sort=recently_followed`.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Selected interests (items no longer in the catalog are left out).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UserInterests'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  put:
    operationId: replaceMyInterests
    tags: [Interests]
    summary: Replace the whole selection
    description: |
      "Next" on Tell us what you're interested in (Figma 1261:36247).
      Replaces the selection in one call and completes the `interests`
      onboarding step. An empty list is allowed. Guests may call it; the
      selection moves to their account when they sign up.

      Errors: `INTEREST_NOT_FOUND` (422, `meta.unknownIds`),
      `INTEREST_LIMIT_EXCEEDED` (422).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserInterestsReplace'
    responses:
      '200':
        description: The saved selection.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UserInterests'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meInterest:
  put:
    operationId: addMyInterest
    tags: [Interests]
    summary: Add one interest
    description: Idempotent (adding twice is fine). For per-tap follow buttons outside onboarding.
    parameters:
      - $ref: '../components/parameters.yaml#/InterestId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: removeMyInterest
    tags: [Interests]
    summary: Remove one interest
    description: Idempotent (removing something not selected is fine).
    parameters:
      - $ref: '../components/parameters.yaml#/InterestId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meNotificationSettings:
  get:
    operationId: getNotificationSettings
    tags: [Account]
    summary: Get the notification switches
    description: |
      Settings > Notifications. A user who never saved them gets every
      switch `true`. Accounts only.

      Errors: `GUEST_NOT_ALLOWED` (403).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: The switches.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/NotificationSettings'
            example:
              likesAndComments: true
              followRequests: true
              profileEngagement: true
              contributorMetrics: true
              yourEngagement: true
              newOrTrendingContent: true
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  patch:
    operationId: updateNotificationSettings
    tags: [Account]
    summary: Change some notification switches
    description: |
      Send only the switches that change; the others keep their value.
      Returns every switch. Accounts only.

      Errors: `GUEST_NOT_ALLOWED` (403).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/NotificationSettingsUpdate'
          example:
            followRequests: false
        application/merge-patch+json:
          schema:
            $ref: '../components/schemas.yaml#/NotificationSettingsUpdate'
    responses:
      '200':
        description: Every switch, after the change.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/NotificationSettings'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meContent:
  get:
    operationId: listMyContent
    tags: [Content]
    summary: List the user's own content
    description: |
      Profile tabs (All, Playlists, Albums, Songs, Stories) and Popular
      Releases (`sort=popular&limit=3`), both with `hidden=false`, and
      Privacy > Hide Content / Restrict Content (no `hidden`). This is the
      owner's view: unless `hidden` filters them, hidden and followers-only
      items are included, with their flags.

      - `type`: `all` (default) or one content type.
      - `sort`: `recent` (default; newest first), `popular` (most listens
        first) or `title` (A to Z, ignoring case and accents). Ties keep a
        stable order.
      - `hidden`: `false` lists only items that are not hidden (the Profile
        page: Popular Releases and the tabs), `true` only hidden ones;
        absent lists both (the Privacy lists).
      - `page.total` counts every item that matches `type` and `hidden`.
      - A cursor only works for the same `type`, `hidden` and `sort` and for
        24 hours (`CURSOR_INVALID`).

      Errors: `GUEST_NOT_ALLOWED` (403), `CURSOR_INVALID` (422).
    x-rate-limit:
      - { key: account, limit: 120, window: 1m }
    parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum: [all, playlist, album, song, story]
          default: all
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [recent, popular, title]
          default: recent
      - name: hidden
        in: query
        required: false
        description: '`false`: only items that are not hidden; `true`: only hidden ones; absent: both.'
        schema:
          type: boolean
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: A page of the user's content.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ContentPage'
            example:
              data:
                - id: 6650f1c2a4b7e9d3c1f00b01
                  type: album
                  title: Late Night Drive
                  image: { url: 'https://cdn.bondfire.app/c/late-night-drive.jpg', width: 512, height: 512, status: ready, blurhash: null }
                  year: 2024
                  songCount: 12
                  durationSec: 2710
                  listens: 48210
                  badge: top10
                  hidden: false
                  followersOnly: false
                  createdAt: '2026-09-27T10:15:00Z'
              page: { nextCursor: null, hasMore: false, total: 1 }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meContentItem:
  patch:
    operationId: updateMyContent
    tags: [Content]
    summary: Hide or restrict one of the user's items
    description: |
      Privacy > Hide Content (`hidden`) and Restrict Content
      (`followersOnly`). Send either or both.

      Errors: `GUEST_NOT_ALLOWED` (403), `CONTENT_NOT_FOUND` (404, also for
      another user's content).
    parameters:
      - $ref: '../components/parameters.yaml#/ContentId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ContentUpdate'
          example:
            hidden: true
        application/merge-patch+json:
          schema:
            $ref: '../components/schemas.yaml#/ContentUpdate'
    responses:
      '200':
        description: The item after the change.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Content'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meMediaUploads:
  post:
    operationId: createUploadIntent
    tags: [Media]
    summary: Get a pre-signed URL to upload a photo
    description: |
      Step 1 of the scalable upload path: the app uploads the bytes straight
      to storage (not through the API), then calls `PUT /me/avatar` or
      `PUT /me/banner` with the `uploadId`. Unused uploads are deleted after
      24 hours.

      Errors: `GUEST_NOT_ALLOWED` (403), `PAYLOAD_TOO_LARGE` (413),
      `UNSUPPORTED_MEDIA_TYPE` (415).
    x-rate-limit:
      - { key: account, limit: 30, window: 1h }
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UploadIntentRequest'
    responses:
      '201':
        description: Upload URL issued.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UploadIntent'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meAvatar:
  put:
    operationId: setAvatar
    tags: [Media]
    summary: Set the profile photo
    description: |
      Save on Your avatar (Figma 1261:32306). Two ways to send the photo,
      same result:

      - `application/json` with an `uploadId` from `POST /me/media/uploads`
        (recommended; scales to any number of users).
      - `multipart/form-data` with the file itself (simple path for the
        first release; max 10 MB).

      Processing: EXIF orientation applied, then **all EXIF removed**
      (including GPS); HEIC converted; crop applied (must be square);
      resized to 128/256/512/1024 px; moderation. `status` is `processing`
      until done; a rejected image is removed and `IMAGE_REJECTED` is
      reported on the next `GET /me` as `avatar: null`.

      The picture's `palette` (colour rules v1, see `ImagePalette`) and
      `blurhash` are worked out from the crop as shown (transparency on
      black) and returned in this answer and in every later `Image` of it.

      Errors: `GUEST_NOT_ALLOWED` (403), `UPLOAD_NOT_FOUND` (404),
      `UPLOAD_EXPIRED` (410), `PAYLOAD_TOO_LARGE` (413),
      `UNSUPPORTED_MEDIA_TYPE` (415), `UPLOAD_INCOMPLETE`,
      `UPLOAD_PURPOSE_MISMATCH`, `IMAGE_UNREADABLE`, `IMAGE_TOO_SMALL`
      (under 200×200 after crop), `IMAGE_DIMENSIONS_TOO_LARGE` (over 8000 px
      per side), `CROP_INVALID`, `IMAGE_REJECTED` (422).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ImageSetFromUpload'
        multipart/form-data:
          schema:
            $ref: '../components/schemas.yaml#/ImageSetMultipart'
          encoding:
            file:
              contentType: image/jpeg, image/png, image/webp, image/heic, image/heif
            crop:
              contentType: application/json
    responses:
      '200':
        description: New avatar (may still be `processing`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Image'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '410': { $ref: '../components/responses.yaml#/Gone' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: removeAvatar
    tags: [Media]
    summary: Remove the profile photo
    description: Idempotent. Files are deleted from storage and CDN caches purged.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meBanner:
  put:
    operationId: setBanner
    tags: [Media]
    summary: Set the profile banner
    description: |
      Save on Your profile banner (Figma 1261:32324). Same rules as
      `PUT /me/avatar`, except the crop uses the banner ratio 393:264
      (±2%), minimum 786×528 px after crop, resized to 786/1179/1572 px wide.
      The banner's `palette` gives the app its personal colour.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ImageSetFromUpload'
        multipart/form-data:
          schema:
            $ref: '../components/schemas.yaml#/ImageSetMultipart'
          encoding:
            file:
              contentType: image/jpeg, image/png, image/webp, image/heic, image/heif
            crop:
              contentType: application/json
    responses:
      '200':
        description: New banner (may still be `processing`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Image'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '410': { $ref: '../components/responses.yaml#/Gone' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '415': { $ref: '../components/responses.yaml#/UnsupportedMediaType' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: removeBanner
    tags: [Media]
    summary: Remove the profile banner
    description: Idempotent.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meSessions:
  get:
    operationId: listSessions
    tags: [Sessions]
    summary: List signed-in devices
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Active sessions, current first.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SessionList'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: revokeOtherSessions
    tags: [Sessions]
    summary: Sign out every other device
    description: Keeps the current session. Idempotent.
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meSession:
  delete:
    operationId: revokeSession
    tags: [Sessions]
    summary: Sign out one device
    description: |
      Revoking the current session is the same as logout. Access tokens
      already issued to that device stay valid until they expire (at most
      15 minutes) unless the server keeps a revocation list.

      Errors: `SESSION_NOT_FOUND` (404).
    parameters:
      - $ref: '../components/parameters.yaml#/SessionId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meIdentities:
  get:
    operationId: listIdentities
    tags: [Sessions]
    summary: List the ways this account can sign in
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Linked sign-in methods.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IdentityList'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  post:
    operationId: linkIdentity
    tags: [Sessions]
    summary: Link Apple, Google or Facebook to this account
    description: |
      Finishes the `ACCOUNT_LINK_REQUIRED` flow (send `linkToken`), or links
      a provider from settings (send `credential`).

      Errors: `LINK_TOKEN_INVALID`, `SOCIAL_TOKEN_INVALID` (401),
      `IDENTITY_ALREADY_LINKED` (409, that provider account belongs to
      another Bondfire user).
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LinkIdentityRequest'
    responses:
      '201':
        description: Linked.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Identity'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meIdentity:
  delete:
    operationId: unlinkIdentity
    tags: [Sessions]
    summary: Unlink a sign-in method
    description: |
      Needs `X-Reauth-Token`. The last remaining way to sign in cannot be
      removed (`LAST_LOGIN_METHOD`, 409).
    parameters:
      - $ref: '../components/parameters.yaml#/Provider'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/ReauthToken'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

meDevice:
  put:
    operationId: registerDevice
    tags: [Devices]
    summary: Register or update this install for push notifications
    description: |
      Idempotent upsert keyed by install. Call after sign-in, whenever the
      push token changes, and when the OS notification permission changes.
      A push token moving to another account is detached from the old one.
      Guests allowed.
    parameters:
      - $ref: '../components/parameters.yaml#/InstallationId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/DeviceRegistration'
    responses:
      '200':
        description: Saved.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/DeviceRegistration'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    operationId: unregisterDevice
    tags: [Devices]
    summary: Stop push notifications to this install
    description: Idempotent. Called on logout.
    parameters:
      - $ref: '../components/parameters.yaml#/InstallationId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
