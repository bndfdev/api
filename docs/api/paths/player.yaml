# The media player: songs, albums, playlists, playback addresses,
# transcripts and listens. Design notes: docs/api/PLAYER.md.

songs:
  get:
    operationId: listSongs
    tags: [Player]
    summary: Get several songs by id
    description: |
      For restoring a saved queue and drawing lists: 1 to 50 song ids,
      comma separated (`?ids=a,b,c`). The answer keeps the order asked.
      Ids that are unknown or not songs are left out without an error, and
      an id asked twice is answered once, at its first place. Guests
      allowed.

      Errors: `VALIDATION_FAILED` (422, no ids or more than 50).
    x-rate-limit:
      - { key: account, limit: 120, window: 1m }
    parameters:
      - name: ids
        in: query
        required: true
        description: Song ids, comma separated (1 to 50).
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '../components/schemas.yaml#/Id'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: The songs found, in the order asked.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SongList'
            example:
              data:
                - id: 6650f1c2a4b7e9d3c1f00c21
                  title: Northbound Hum
                  artist: { id: 6650f1c2a4b7e9d3c1f00a22, name: Theo Brannick, image: null }
                  album: null
                  image: { url: 'https://cdn.bondfire.app/c/northbound-hum/512.jpg', width: 512, height: 512, status: ready, blurhash: 'LEHV6nWB2yk8pyo0adR*.7kCMdnj', palette: { version: 1, seed: '#FFFFFF', accent: '#747676', neutral: true } }
                  durationMs: 176500
                  waveform: [0.02, 0.33, 0.61, 0.66, 0.70, 0.57, 0.25, 0.23, 0.48, 0.58, 0.58, 0.77, 0.90, 0.64, 0.20, 0.02]
                  transcriptLanguages: []
                  listens: 913
                  commentCount: 0
                  latestComment: null
                  liked: false
                  followersOnly: false
                  playable: true
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

song:
  get:
    operationId: getSong
    tags: [Player]
    summary: Get a song
    description: |
      Everything the player shows for one song: title, artist (and their
      photo, used when there is no artwork), album, artwork with `palette`
      and `blurhash`, length, waveform, transcript languages, counts, the
      latest comment (the pill) and the viewer's heart. Guests allowed
      (`liked` is then `false`).

      - A followers-only song is still described, with `playable: false`
        for a viewer who may not play it; only its audio, transcript and
        comments are withheld (`CONTENT_RESTRICTED`).
      - A hidden song (Hide Content) still answers: hiding takes it off its
        artist's Profile, not out of albums, playlists or queues.
      - To play it, get `GET /songs/{songId}/playback`.

      Errors: `CONTENT_NOT_FOUND` (404, also for an id that is not a song).
    x-rate-limit:
      - { key: account, limit: 120, window: 1m }
    parameters:
      - $ref: '../components/parameters.yaml#/SongId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: The song.
        content:
          application/json:
