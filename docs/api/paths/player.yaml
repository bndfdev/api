songPlayback:
  get:
    operationId: getSongPlayback
    tags: [Player]
    summary: Get the address to stream a song from
    description: |
      Called right before a song plays. `url` works for 6 hours
      (`expiresAt`) and answers HTTP Range requests, so the player can seek
      and resume with a plain URL. Fetch a new one when it has expired (it
      then answers 403); never store or share it. Fetching it does not
      count a listen (`POST /me/listens` does). Guests allowed.

      Errors: `CONTENT_RESTRICTED` (403, followers-only and the viewer may
      not play it), `CONTENT_NOT_FOUND` (404), `AUDIO_UNAVAILABLE` (409, no
      audio yet, or still being processed).
    x-rate-limit:
      - { key: account, limit: 120, window: 1m }
    parameters:
      - $ref: '../components/parameters.yaml#/SongId'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
    responses:
      '200':
        description: Where to stream it from, for the next 6 hours.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Playback'
            example:
              url: 'https://cdn.bondfire.app/audio/6650f1c2a4b7e9d3c1f00c11/128k.m4a?exp=1794600000&sig=Qm9uZGZpcmVTaWc'
              expiresAt: '2026-11-13T16:00:00Z'
              mimeType: audio/mp4
              sizeBytes: 3473920
              durationMs: 214380
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403':
        description: The song is followers-only and the viewer may not play it (`CONTENT_RESTRICTED`).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
            example:
              type: https://api.bondfire.app/errors/content-restricted
              title: Only followers can play this
              status: 403
              code: CONTENT_RESTRICTED
              requestId: req_01J8Z3K5QH
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: The song has no audio yet, or it is still being processed (`AUDIO_UNAVAILABLE`).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
            example:
              type: https://api.bondfire.app/errors/audio-unavailable
              title: This song is not ready to play yet
              status: 409
              code: AUDIO_UNAVAILABLE
              requestId: req_01J8Z3K5QH
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

songTranscript:
  get:
    operationId: getSongTranscript
    tags: [Player]
    summary: Get a song's timed transcript
    description: |
      The words of the song with their times, for the player's live
      transcript, in the shape the app parses (`TimedTranscript.fromJson`).
      Guests allowed.

      - `language` picks one of `Song.transcriptLanguages`. Without it, the
        server picks from `Accept-Language`: the first language there (in
        order of preference, matched on the main subtag, so `es-MX` finds
        `es`) that the song has a transcript in, a translation or the
        original; when none matches, the original.
      - `translatedFrom` is the original's language when the text is a
        translation (the "Translated from English" pill), else `null`.
        `availableLanguages` lists every language, the original first.
      - A line has either `words`, each with its own times, or one `text`
        with the line's times. Times are whole milliseconds from the start
        of the song; words never go back in time, and no `endMs` is before
        its `startMs`.

      Errors: `CONTENT_RESTRICTED` (403, followers-only and the viewer may
      not play it), `CONTENT_NOT_FOUND` (404), `TRANSCRIPT_NOT_FOUND` (404,
      none in that language or none at all; the app hides the flip button).
    x-rate-limit:
      - { key: account, limit: 120, window: 1m }
    parameters:
      - $ref: '../components/parameters.yaml#/SongId'
      - name: language
        in: query
        required: false
        description: The transcript language wanted. Omit it to let `Accept-Language` decide.
        schema:
          $ref: '../components/schemas.yaml#/TranscriptLanguage'
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - name: Accept-Language
        in: header
        required: false
        description: Picks the transcript language when `language` is not sent (and the language of error titles).
        schema:
          type: string
          examples: ['es-MX, es;q=0.9, en;q=0.8']
    responses:
      '200':
        description: The transcript.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Transcript'
            examples:
              original:
                summary: The original, timed word by word
                value:
                  language: en
                  translatedFrom: null
                  availableLanguages: [en, es]
                  lines:
                    - words:
                        - { text: We, startMs: 12400, endMs: 12620 }
                        - { text: fly, startMs: 12620, endMs: 12980 }
                        - { text: paper, startMs: 12980, endMs: 13410 }
                        - { text: kites, startMs: 13410, endMs: 13900 }
                        - { text: at, startMs: 13900, endMs: 14050 }
                        - { text: noon, startMs: 14050, endMs: 14800 }
                    - { text: Over the bay the gulls reply, startMs: 15200, endMs: 18900 }
              translation:
                summary: A translation, timed line by line
                value:
                  language: es
                  translatedFrom: en
                  availableLanguages: [en, es]
                  lines:
                    - { text: Volamos cometas de papel al mediodía, startMs: 12400, endMs: 14800 }
                    - { text: Sobre la bahía responden las gaviotas, startMs: 15200, endMs: 18900 }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403':
        description: The song is followers-only and the viewer may not play it (`CONTENT_RESTRICTED`).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '404':
        description: No such song (`CONTENT_NOT_FOUND`), or no transcript in that language (`TRANSCRIPT_NOT_FOUND`).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
            example:
              type: https://api.bondfire.app/errors/transcript-not-found
              title: No transcript in this language
              status: 404
              code: TRANSCRIPT_NOT_FOUND
              requestId: req_01J8Z3K5QH
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '426': { $ref: '../components/responses.yaml#/UpgradeRequired' }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

