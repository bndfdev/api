meListens:
  post:
    operationId: recordListens
    tags: [Player]
    summary: Report listens
    description: |
      The app sends one event each time a song stops being the current one
      (it finished, was skipped or replaced, or the app closed), and may
      hold events to send several at once (1 to 50 per call). Guests
      allowed.

      - A listen counts towards `Song.listens` when `listenedMs` is at
        least 30000 (30 seconds) or `completed` is `true` (the rule is an
        open question, see `docs/api/PLAYER.md`). Counting happens after
        the answer: `202` only says the batch was received.
      - A `playlist` or `liked_songs` `source` moves that entry's
        `playedAt` in the listener's library ("Recently played").
      - Events for unknown songs or songs the listener may not play, and
        events whose `endedAt` is more than 30 days old or more than 5
        minutes in the future, are dropped without an error, so one bad
        event never blocks the rest.
      - An event sent again (same listener, song and `endedAt`) is
        ignored, so a resend never counts twice. Send `Idempotency-Key` too.

      Errors: `VALIDATION_FAILED` (422, a batch in another shape);
      `IDEMPOTENCY_IN_PROGRESS` (409) and `IDEMPOTENCY_KEY_REUSED` (422) as
      described on `Idempotency-Key`.
    x-rate-limit:
      - { key: account, limit: 60, window: 1m }
    parameters:
      - $ref: '../components/parameters.yaml#/ClientPlatform'
      - $ref: '../components/parameters.yaml#/ClientVersion'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ListenBatch'
          example:
            events:
              - songId: 6650f1c2a4b7e9d3c1f00c12
                listenedMs: 187040
                completed: true
                endedAt: '2026-11-13T09:58:12Z'
                source: { type: album, id: 6650f1c2a4b7e9d3c1f00c10 }
              - songId: 6650f1c2a4b7e9d3c1f00c11
                listenedMs: 8200
                completed: false
                endedAt: '2026-11-13T09:58:21Z'
                source: { type: liked_songs }
    responses:
      '202':
        description: Received. No body; listens are counted afterwards.
        headers:
          X-Request-Id:
