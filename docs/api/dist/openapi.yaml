      summary: Delete a comment or a reply
      description: |
        For its author, and for the song's owner (the artist, `Song.artist.id`).
        Deleting a top-level comment deletes its replies too; `commentCount`
        and `replyCount` drop at once. A comment already deleted is
        `COMMENT_NOT_FOUND`, which the app treats as done. Accounts only.

        Errors: `GUEST_NOT_ALLOWED`, `FORBIDDEN` (403, someone else's comment
        on someone else's song), `COMMENT_NOT_FOUND` (404).
      x-rate-limit:
        - key: account
          limit: 30
          window: 1m
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /comments/{commentId}/replies:
    get:
      operationId: listCommentReplies
      tags:
        - Comments
      summary: List a comment's replies
      description: |
        "View more replies" under a comment: its replies, oldest first. The
        first page starts at the oldest reply, so it repeats the ones the
        comment already carries; the app skips those it has. A reply has no
        replies of its own (its list is empty). `page.total` is the
        comment's `replyCount`. Guests allowed.

        Errors: `CONTENT_RESTRICTED` (403, the song is followers-only and the
        viewer may not play it), `COMMENT_NOT_FOUND` (404), `CURSOR_INVALID`
        (422).
      x-rate-limit:
        - key: account
          limit: 120
          window: 1m
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: A page of replies, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReplyPage'
              example:
                data:
                  - id: 6650f1c2a4b7e9d3c1f00e02
                    parentId: 6650f1c2a4b7e9d3c1f00e01
                    author:
                      id: 6650f1c2a4b7e9d3c1f00a23
                      name: null
                      avatar: null
                    text: Same here, it was on repeat on my walk home.
                    createdAt: '2026-11-12T19:02:00Z'
                    likeCount: 3
                    likedByMe: false
                    replyCount: 0
                    isMine: false
                page:
                  nextCursor: null
                  hasMore: false
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The song is followers-only and the viewer may not play it (`CONTENT_RESTRICTED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postCommentReply
      tags:
        - Comments
      summary: Reply to a comment
      description: |
        Replies are one level deep: replying to a reply adds the new reply to
        the same top-level comment, and the answer's `parentId` says which.
        Same text rules and limit as `POST /songs/{songId}/comments` (10 a
        minute, comments and replies together). Accounts only.

        Errors: `GUEST_NOT_ALLOWED`, `CONTENT_RESTRICTED` (403),
        `COMMENT_NOT_FOUND` (404), `VALIDATION_FAILED` (422, blank or too
        long; `field` `/text`); `IDEMPOTENCY_IN_PROGRESS` (409) and
        `IDEMPOTENCY_KEY_REUSED` (422) as described on `Idempotency-Key`.
      x-rate-limit:
        - key: account
          limit: 10
          window: 1m
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
            example:
              text: Agreed, that part gets me every time.
      responses:
        '201':
          description: The reply as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
                id: 6650f1c2a4b7e9d3c1f00e06
                parentId: 6650f1c2a4b7e9d3c1f00e01
                author:
                  id: 6650f1c2a4b7e9d3c1f00a12
                  name: Amelia Jane
                  avatar: null
                text: Agreed, that part gets me every time.
                createdAt: '2026-11-13T10:03:00Z'
                likeCount: 0
                likedByMe: false
                replyCount: 0
                isMine: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /comments/{commentId}/like:
    put:
      operationId: likeComment
      tags:
        - Comments
      summary: Like a comment or a reply
      description: |
        Idempotent: liking it again changes nothing. Answers with its likes
        after the change. Accounts only.

        Errors: `GUEST_NOT_ALLOWED`, `CONTENT_RESTRICTED` (403),
        `COMMENT_NOT_FOUND` (404).
      x-rate-limit:
        - key: account
          limit: 60
          window: 1m
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: The comment's likes after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentLike'
              example:
                likeCount: 13
                likedByMe: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unlikeComment
      tags:
        - Comments
      summary: Unlike a comment or a reply
      description: |
        Idempotent: unliking one not liked changes nothing. Answers with its
        likes after the change. Accounts only.

        Errors: `GUEST_NOT_ALLOWED`, `CONTENT_RESTRICTED` (403),
        `COMMENT_NOT_FOUND` (404).
      x-rate-limit:
        - key: account
          limit: 60
          window: 1m
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: The comment's likes after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentLike'
              example:
                likeCount: 12
                likedByMe: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from any sign-in call. JWT signed with ES256; claims:
        `sub` (user id), `sid` (session id), `acct` (`user` | `guest`),
        `iat`, `exp` (15 minutes), `iss`, `aud`. Clients treat it as opaque.
  schemas:
    readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - degraded
            - down
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - failing
          examples:
            - database: ok
              email: ok
              sms: failing
              storage: ok
    Platform:
      type: string
      enum:
        - ios
        - android
        - web
    PasswordPolicy:
      type: object
      required:
        - minLength
        - maxLength
        - requireUppercase
        - requireLowercase
        - requireDigit
        - requireSymbol
      properties:
        minLength:
          type: integer
          examples:
            - 12
        maxLength:
          type: integer
          examples:
            - 128
        requireUppercase:
          type: boolean
          examples:
            - true
        requireLowercase:
          type: boolean
          examples:
            - false
        requireDigit:
          type: boolean
          examples:
            - true
        requireSymbol:
          type: boolean
          examples:
            - true
    LanguageTag:
      type: string
      description: BCP 47 language tag from `GET /config` → `supportedLanguages`.
      pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
      examples:
        - en
        - es
        - hi
    AppConfig:
      type: object
      description: |
        Everything the app would otherwise hardcode. Cache it (see `ETag`) and
        refresh on launch; the app must still work with the last cached copy.
      required:
        - minimumSupportedVersion
        - passwordPolicy
        - otp
        - minimumAge
        - supportedLanguages
        - legal
        - features
        - limits
      properties:
        minimumSupportedVersion:
          type: object
          description: Older builds receive `426 UPGRADE_REQUIRED` on every call.
          properties:
            ios:
              type: string
              examples:
                - 1.0.0
            android:
              type: string
              examples:
                - 1.0.0
            web:
              type: string
              examples:
                - 1.0.0
        latestVersion:
          type: object
          description: Used to show an optional "update available" prompt.
          properties:
            ios:
              type: string
            android:
              type: string
            web:
              type: string
        passwordPolicy:
          $ref: '#/components/schemas/PasswordPolicy'
        otp:
          type: object
          required:
            - length
            - ttlSeconds
            - resendCooldownSeconds
            - maxAttempts
          properties:
            length:
              type: integer
              const: 6
            ttlSeconds:
              type: integer
              examples:
                - 600
            resendCooldownSeconds:
              type: integer
              examples:
                - 30
            maxAttempts:
              type: integer
              examples:
                - 5
        minimumAge:
          type: integer
          examples:
            - 13
        supportedLanguages:
          type: array
          items:
            type: object
            required:
              - tag
              - name
              - nativeName
            properties:
              tag:
                $ref: '#/components/schemas/LanguageTag'
              name:
                type: string
                examples:
                  - Hindi
              nativeName:
                type: string
                examples:
                  - हिन्दी
        legal:
          type: object
          required:
            - termsVersion
            - privacyVersion
          properties:
            termsVersion:
              type: string
              examples:
                - '2026-09-01'
            privacyVersion:
              type: string
              examples:
                - '2026-09-01'
        features:
          type: object
          description: Remote switches, so a feature can be turned off without an app release.
          properties:
            guestMode:
              type: boolean
            phoneVerificationRequired:
              type: boolean
            socialLogin:
              type: object
              properties:
                apple:
                  type: boolean
                google:
                  type: boolean
                facebook:
                  type: boolean
        limits:
          type: object
          properties:
            maxInterests:
              type: integer
              examples:
                - 100
            avatarMaxBytes:
              type: integer
              examples:
                - 10485760
            bannerMaxBytes:
              type: integer
              examples:
                - 10485760
            nameMaxLength:
              type: integer
              examples:
                - 50
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code. New codes may be added in v1;
        clients must treat unknown codes by their HTTP status.

        Codes of the media player (tags Player, Library and Comments):
        - `CONTENT_NOT_FOUND` (404): no song, album or playlist with that id (or the id is of another type).
        - `CONTENT_RESTRICTED` (403): the song is followers-only and the viewer may not play it, so its audio,
          transcript and comments are withheld.
        - `AUDIO_UNAVAILABLE` (409): the song has no audio yet, or its audio is still being processed.
        - `TRANSCRIPT_NOT_FOUND` (404): the song has no transcript in that language, or none at all.
        - `PLAYLIST_NOT_FOUND` (404): an id is not a playlist in the user's library; `meta.playlistIds` lists them.
        - `PLAYLIST_NOT_EDITABLE` (403): a playlist is not the user's own, so songs cannot be added to it or
          taken out of it; `meta.playlistIds` lists them.
        - `COMMENT_NOT_FOUND` (404): the comment does not exist or was deleted.

        Codes of artist pages (tag Artists): an unknown artist is the generic `NOT_FOUND` (404).
        - `CANNOT_FOLLOW_SELF` (422): the artist to follow is the caller.
      enum:
        - MALFORMED_REQUEST
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - FORBIDDEN
        - GUEST_NOT_ALLOWED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PRECONDITION_FAILED
        - RATE_LIMITED
        - UPGRADE_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - MAINTENANCE
        - EMAIL_INVALID
        - EMAIL_DOMAIN_NOT_ALLOWED
        - EMAIL_TAKEN
        - EMAIL_DELIVERY_FAILED
        - CHALLENGE_NOT_FOUND
        - CHALLENGE_EXPIRED
        - CHALLENGE_LOCKED
        - CHALLENGE_ALREADY_USED
        - CODE_INCORRECT
        - CODE_FORMAT_INVALID
        - RESEND_TOO_SOON
        - SEND_LIMIT_REACHED
        - SIGNUP_TOKEN_INVALID
        - SIGNUP_TOKEN_EXPIRED
        - PASSWORD_POLICY_VIOLATION
        - PASSWORD_COMPROMISED
        - PASSWORD_REUSED
        - PASSWORD_INCORRECT
        - AGE_REQUIREMENT_NOT_MET
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - ACCOUNT_SUSPENDED
        - ACCOUNT_PENDING_DELETION
        - ACCOUNT_DELETED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - SESSION_REVOKED
        - SESSION_NOT_FOUND
        - REAUTH_REQUIRED
        - RESET_TOKEN_INVALID
        - RESET_TOKEN_EXPIRED
        - SOCIAL_PROVIDER_UNSUPPORTED
        - SOCIAL_TOKEN_INVALID
        - SOCIAL_NONCE_MISMATCH
        - SOCIAL_EMAIL_UNVERIFIED
        - ACCOUNT_LINK_REQUIRED
        - LINK_TOKEN_INVALID
        - IDENTITY_ALREADY_LINKED
        - LAST_LOGIN_METHOD
        - PHONE_INVALID
        - PHONE_REGION_UNSUPPORTED
        - PHONE_TYPE_NOT_ALLOWED
        - PHONE_TAKEN
        - SMS_DELIVERY_FAILED
        - NAME_INVALID
        - DATE_OF_BIRTH_INVALID
        - DATE_OF_BIRTH_LOCKED
        - LANGUAGE_UNSUPPORTED
        - LOCATION_INVALID
        - LEGAL_DOCUMENT_NOT_FOUND
        - LEGAL_VERSION_OUTDATED
        - CONSENT_REQUIRED
        - ONBOARDING_STEP_INVALID
        - ONBOARDING_STEP_NOT_SKIPPABLE
        - INTEREST_NOT_FOUND
        - INTEREST_LIMIT_EXCEEDED
        - SEARCH_QUERY_INVALID
        - CURSOR_INVALID
        - CONTENT_NOT_FOUND
        - HAND_PICKED_INVALID
        - CONTENT_RESTRICTED
        - AUDIO_UNAVAILABLE
        - TRANSCRIPT_NOT_FOUND
        - PLAYLIST_NOT_FOUND
        - PLAYLIST_NOT_EDITABLE
        - COMMENT_NOT_FOUND
        - CANNOT_FOLLOW_SELF
        - UPLOAD_NOT_FOUND
        - UPLOAD_EXPIRED
        - UPLOAD_INCOMPLETE
        - UPLOAD_PURPOSE_MISMATCH
        - IMAGE_UNREADABLE
        - IMAGE_TOO_SMALL
        - IMAGE_DIMENSIONS_TOO_LARGE
        - IMAGE_REJECTED
        - CROP_INVALID
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON pointer to the invalid field in the request body or a query parameter name.
          examples:
            - /password
            - q
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, localised.
        meta:
          type: object
          additionalProperties: true
          examples:
            - unmetRules:
                - uppercase
                - symbol
    Problem:
      type: object
      description: |
        Every error response uses this shape with content type
        `application/problem+json`. Clients branch on `code`, never on `title`
        or `detail` (those are human-readable and may be translated).
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable link to documentation for this error code.
          examples:
            - https://api.bondfire.app/errors/email-taken
        title:
          type: string
          description: Short, human-readable summary, localised via `Accept-Language`.
          examples:
            - Email already registered
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation safe to show to the user.
        instance:
          type: string
          description: Path of the request that failed.
          examples:
            - /v1/auth/signup/email
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
          description: Same value as the `X-Request-Id` response header. Quote it in bug reports.
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: Present for 423, 429 and 503. Mirrors the `Retry-After` header.
        errors:
          type: array
          description: Field-level problems (422 only). One entry per invalid field.
          items:
            $ref: '#/components/schemas/FieldError'
        meta:
          type: object
          description: Extra machine-readable data for specific codes (see each operation).
          additionalProperties: true
    LegalDocumentType:
      type: string
      enum:
        - terms
        - privacy
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp, always UTC (`Z`).
      examples:
        - '2026-09-27T10:15:00Z'
    LegalDocument:
      type: object
      required:
        - type
        - version
        - title
        - summary
        - url
        - effectiveAt
        - requiresAcceptance
      properties:
        type:
          $ref: '#/components/schemas/LegalDocumentType'
        version:
          type: string
          examples:
            - '2026-09-01'
        title:
          type: string
          examples:
            - Terms and Conditions
        summary:
          type: string
          description: The short excerpt shown on the Terms screen (Figma 1270:11938).
        url:
          type: string
          format: uri
          description: Full text, opened in the in-app browser.
        effectiveAt:
          $ref: '#/components/schemas/Timestamp'
        requiresAcceptance:
          type: boolean
    Country:
      type: object
      required:
        - code
        - name
        - dialCode
        - flagEmoji
        - phoneSignupSupported
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
          examples:
            - US
        name:
          type: string
          description: Localised via `Accept-Language`.
          examples:
            - United States
        dialCode:
          type: string
          pattern: ^\+[0-9]{1,4}$
          examples:
            - '+1'
        flagEmoji:
          type: string
          examples:
            - 🇺🇸
        exampleNumber:
          type: string
          description: National format example for the input placeholder.
          examples:
            - 415-555-0123
        phoneSignupSupported:
          type: boolean
          description: '`false` for regions we cannot send SMS to (the app greys them out).'
        contentAvailable:
          type: boolean
          description: Whether Bondfire content is available there (Figma note - "only shipping in US").
    CountryList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'
        defaultCountryCode:
          type: string
          description: Best guess from the request IP, for preselecting the phone picker.
          examples:
            - US
    Id:
      type: string
      description: Opaque identifier. Clients must not parse it or assume a format.
      minLength: 1
      maxLength: 64
      examples:
        - 6650f1c2a4b7e9d3c1f00a12
    InterestKind:
      type: string
      description: |
        What an interest points at. Maps the Figma content types; new kinds may
        be added, so clients must render unknown kinds generically.
      enum:
        - heritage
        - place
        - genre
        - artist
        - album
        - song
        - story
        - playlist
        - favorite
    ImagePalette:
      type: object
      description: |
        The colours of an avatar, banner or piece of song or album artwork, worked out once at upload by colour
        rules v1 from the picture exactly as shown (the crop, with transparency flattened onto black). The app
        takes its personal colour from the banner's palette: `accent` on primary buttons, selected tags and
        switches; the player takes its colours from the artwork's palette the same way. The rules group the picture's
        colours (Material colour utilities), pick the main colour family that covers at least 5% of the picture,
        and adjust its tone, keeping its hue, so that white text on it reads at 4.5:1 and it stands out 3:1 from
        the page background (black at 80% over the blurred banner). A yellow that would turn olive at that tone
        becomes a deep gold instead (for `#FFE600`, `#976F00`). A picture with no real colour (white, black,
        grey, or a colour on less than 5% of it) is `neutral`: its accent is a grey with a faint tint of the photo.
        The app runs the same rules only when this is `null`.
      required:
        - version
        - seed
        - accent
        - neutral
      properties:
        version:
          type: integer
          minimum: 1
          description: Which version of the colour rules made it (now 1). A later version can recompute older ones.
        seed:
          type: string
          pattern: ^#[0-9A-F]{6}$
          description: The picture's main colour, unadjusted (for a neutral picture, its average colour). `#RRGGBB`, upper case.
          examples:
            - '#D02020'
        accent:
          type: string
          pattern: ^#[0-9A-F]{6}$
          description: The colour to use for buttons, selected tags and switches, already readable with white text. `#RRGGBB`, upper case.
          examples:
            - '#D02020'
        neutral:
          type: boolean
          description: True when the picture has no real colour; the accent is then a grey taken from it.
      examples:
        - version: 1
          seed: '#D02020'
          accent: '#D02020'
          neutral: false
        - version: 1
          seed: '#FFFFFF'
          accent: '#747676'
          neutral: true
    Image:
      type: object
      required:
        - url
        - width
        - height
        - status
      properties:
        url:
          type: string
          format: uri
          description: CDN URL of the default size. URLs change when the image changes, so they can be cached forever.
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          enum:
            - processing
            - ready
            - rejected
          description: '`processing` right after upload while variants and moderation run; poll `GET /me` or wait for the next fetch.'
        blurhash:
          type:
            - string
            - 'null'
          description: |
            Tiny placeholder to paint while the image loads: a BlurHash with 4x3 components (28 characters) of the
            picture as shown, worked out at upload. Filled for avatars and banners, and for song and album artwork
            too (`Song.image`, `Album.image`; worked out when the artwork is uploaded, see `docs/api/PLAYER.md`).
            `null` for images stored before this was added, until the backfill has run.
          examples:
            - L*J3}y{@OGOHspn~a}a}fQfQfQfQ
        palette:
          oneOf:
            - $ref: '#/components/schemas/ImagePalette'
            - type: 'null'
          description: |
            The picture's colours, worked out at upload by colour rules v1 (see `ImagePalette`). Filled for avatars
            and banners, and for song and album artwork too (worked out when the artwork is uploaded); `null` (or
            absent) for images stored before this was added, until the backfill has run. When it is `null` the app
            works the colours out itself with the same rules.
        variants:
          type: object
          description: Resized copies keyed by width in pixels.
          additionalProperties:
            type: string
            format: uri
          examples:
            - '128': https://cdn.bondfire.app/a/128.jpg
              '512': https://cdn.bondfire.app/a/512.jpg
    Interest:
      type: object
      required:
        - id
        - kind
        - title
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/InterestKind'
        title:
          type: string
          examples:
            - San Francisco
        subtitle:
          type:
            - string
            - 'null'
          examples:
            - Daya
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        presentation:
          type: object
          description: Layout hint for the featured grid (Figma 1261:36247).
          properties:
            size:
              type: string
              enum:
                - small
                - large
              default: small
    PageInfo:
      type: object
      required:
        - hasMore
        - total
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass as `cursor` to get the next page. Opaque; expires after 24 hours (`CURSOR_INVALID`).
        hasMore:
          type: boolean
        total:
          type: integer
          minimum: 0
          description: How many items match the request across all pages (the "All (2846)" count), not just this page.
    InterestPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        page:
          $ref: '#/components/schemas/PageInfo'
    Email:
      type: string
      format: email
      maxLength: 254
      description: |
        Email address. The server trims whitespace, lowercases the domain and
        compares the whole address case-insensitively. `name+tag@` addresses are
        accepted and treated as distinct accounts. Internationalised domains are
        accepted and stored in punycode.
      examples:
        - amelia.jane@example.com
    EmailRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
    EmailAvailability:
      type: object
      required:
        - email
        - available
      properties:
        email:
          $ref: '#/components/schemas/Email'
        available:
          type: boolean
          description: '`false` when the address already has an account.'
        suggestion:
          description: Likely typo fix for the domain, if any (for a "Did you mean …?" hint).
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
          examples:
            - amelia.jane@gmail.com
    ChallengePurpose:
      type: string
      description: |
        What a verified code unlocks:
        - `signup_email`: a `signupToken` for `POST /auth/signup/complete`.
        - `password_reset`: a `resetToken` for `POST /auth/password-reset/complete`.
        - `phone_verification`: the number becomes the account's verified phone (`POST /me/phone/verification`).
        - `change_email`: the address becomes the account's verified email (`POST /me/email/verification`).
      enum:
        - signup_email
        - password_reset
        - phone_verification
        - change_email
    MaskedDestination:
      type: string
      description: Where a code was sent, partly hidden for display (never the full value).
      examples:
        - a•••••e@example.com
        - +1 •••-•••-0123
    Challenge:
      type: object
      description: |
        A one-time code that was sent somewhere. The code itself is never
        returned. A resend keeps the same `id` and invalidates the previous code.
      required:
        - id
        - purpose
        - channel
        - destination
        - codeLength
        - expiresAt
        - resendAvailableAt
        - attemptsRemaining
        - sendsRemaining
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          $ref: '#/components/schemas/ChallengePurpose'
        channel:
          type: string
          enum:
            - email
            - sms
        destination:
          $ref: '#/components/schemas/MaskedDestination'
        codeLength:
          type: integer
          const: 6
        expiresAt:
          description: When the current code stops working (10 minutes after it was sent).
          $ref: '#/components/schemas/Timestamp'
        resendAvailableAt:
          description: Earliest time a resend is accepted. Drives the "Send again in N seconds" label.
          $ref: '#/components/schemas/Timestamp'
        attemptsRemaining:
          type: integer
          minimum: 0
          description: Wrong-code attempts left before the challenge locks.
        sendsRemaining:
          type: integer
          minimum: 0
          description: Sends left for this destination in the rolling 24-hour window.
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 128
      description: |
        New password. Policy (also served by `GET /config`): 12–128 characters,
        at least one uppercase letter, one digit and one symbol. Any Unicode is
        allowed; it is NFKC-normalised before hashing and never truncated.
        The server may also reject passwords found in known breach lists
        (`PASSWORD_COMPROMISED`).
    DeviceInfo:
      type: object
      description: |
        Describes the app install making the request. Sent on every call that
        creates a session so sessions can be listed and revoked per device.
      required:
        - installationId
        - platform
        - appVersion
      additionalProperties: false
      properties:
        installationId:
          type: string
          format: uuid
          description: Random UUID generated on first launch and kept until the app is uninstalled. Not a hardware identifier.
        platform:
          $ref: '#/components/schemas/Platform'
        appVersion:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$
          examples:
            - 1.4.0+42
        osVersion:
          type: string
          maxLength: 32
          examples:
            - iOS 18.1
        model:
          type: string
          maxLength: 64
          description: Marketing model name, for the session list only.
          examples:
            - iPhone 16
        locale:
          type: string
          maxLength: 35
          examples:
            - en-IN
        timeZone:
          type: string
          maxLength: 64
          description: IANA zone name, used to compute age on the user's local date.
          examples:
            - Asia/Kolkata
    SignupCompleteRequest:
      type: object
      required:
        - signupToken
        - password
        - device
      additionalProperties: false
      properties:
        signupToken:
          type: string
        password:
          $ref: '#/components/schemas/Password'
        device:
          $ref: '#/components/schemas/DeviceInfo'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageTag'
    TokenPair:
      type: object
      required:
        - tokenType
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: 'Short-lived JWT (15 minutes). Send as `Authorization: Bearer <accessToken>`.'
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        refreshToken:
          type: string
          description: |
            Opaque, single-use. Every refresh returns a new one and retires the
            old one. Store it in the Keychain / Android Keystore, never in plain
            storage.
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    SessionInfo:
      type: object
      required:
        - id
        - createdAt
        - lastActiveAt
        - current
        - device
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastActiveAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: '`true` for the session making the request.'
        signInMethod:
          type: string
          enum:
            - password
            - apple
            - google
            - facebook
            - guest
            - password_reset
        device:
          type: object
          properties:
            platform:
              $ref: '#/components/schemas/Platform'
            model:
              type: string
            appVersion:
              type: string
        approximateLocation:
          type: string
          description: City-level location from the IP address, for the session list only.
          examples:
            - Bengaluru, IN
    AccountType:
      type: string
      enum:
        - user
        - guest
    PhoneNumber:
      type: string
      description: Phone number in E.164 format (`+` then country code and number, digits only).
      pattern: ^\+[1-9][0-9]{6,14}$
      examples:
        - '+14155550123'
    DateOfBirth:
      type: string
      format: date
      description: |
        Calendar date `YYYY-MM-DD` with no time zone. Must be a real date, not in
        the future, and the person must be at least `minimumAge` (13) years old
        and at most 120 years old.
      examples:
        - '2000-01-12'
    Gender:
      type: string
      description: As offered on the Figma gender screen (1261:31795).
      enum:
        - female
        - male
        - non_binary
        - prefer_not_to_say
    AccountPrivacy:
      type: string
      description: |
        Privacy > Account Privacy. `followers` is the "Restrict to Followers"
        toggle turned on; `public` (the default) is off.
      enum:
        - public
        - followers
    LocationSharing:
      type: string
      description: |
        Account > Location Sharing, chosen on the Location Services screen
        (Figma 1627:73609): `always` is "Always allow", `while_using` is "Only
        when app is open", `never` (the default) is "Never". It records the
        user's choice only; the device's own location permission is asked for
        by the app.
      enum:
        - always
        - while_using
        - never
    OnboardingStepName:
      type: string
      description: Steps of the Figma onboarding flow, in order.
      enum:
        - email_verified
        - password_set
        - phone_verified
        - date_of_birth
        - terms_accepted
        - gender
        - interests
        - profile
    OnboardingStep:
      type: object
      required:
        - step
        - status
        - skippable
      properties:
        step:
          $ref: '#/components/schemas/OnboardingStepName'
        status:
          type: string
          enum:
            - pending
            - completed
            - skipped
        skippable:
          type: boolean
        updatedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Onboarding:
      type: object
      description: |
        Server-side onboarding progress, so a user who reinstalls or switches
        phones resumes where they stopped. Data steps complete automatically
        when their data is saved; `interests` and `profile` can also be skipped.
      required:
        - status
        - steps
      properties:
        status:
          type: string
          enum:
            - in_progress
            - completed
        nextStep:
          description: First step still pending, or `null` when everything is done or skipped.
          oneOf:
            - $ref: '#/components/schemas/OnboardingStepName'
            - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
    ConsentStatus:
      type: object
      required:
        - termsUpToDate
        - privacyUpToDate
      properties:
        termsAcceptedVersion:
          type:
            - string
            - 'null'
        termsUpToDate:
          type: boolean
          description: '`false` when a newer terms version needs acceptance; the app shows the Terms screen again.'
        privacyAcceptedVersion:
          type:
            - string
            - 'null'
        privacyUpToDate:
          type: boolean
    User:
      type: object
      description: The signed-in account as its owner sees it (private view).
      required:
        - id
        - accountType
        - status
        - storyTranslation
        - location
        - accountPrivacy
        - locationSharing
        - onboarding
        - consents
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        accountType:
          $ref: '#/components/schemas/AccountType'
        status:
          type: string
          enum:
            - active
            - pending_deletion
        deletionScheduledAt:
          description: Set while `status` is `pending_deletion`; signing in before then cancels the deletion.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        email:
          description: Changed only through `POST /me/email/verification` (not `PATCH /me`).
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        emailVerified:
          type: boolean
        phoneNumber:
          oneOf:
            - $ref: '#/components/schemas/PhoneNumber'
            - type: 'null'
        phoneVerified:
          type: boolean
        name:
          type:
            - string
            - 'null'
          maxLength: 50
        dateOfBirth:
          oneOf:
            - $ref: '#/components/schemas/DateOfBirth'
            - type: 'null'
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        preferredLanguage:
          description: The app and stories language (Settings > Stories Language).
          oneOf:
            - $ref: '#/components/schemas/LanguageTag'
            - type: 'null'
        storyTranslation:
          type: boolean
          description: Account Information > Story Translation. `false` until the user turns it on (always `false` for guests).
        location:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
          description: The free-text location on the Location screen, as saved (trimmed). `null` when not set.
          examples:
            - Seattle, WA
        accountPrivacy:
          $ref: '#/components/schemas/AccountPrivacy'
        locationSharing:
          $ref: '#/components/schemas/LocationSharing'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        banner:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        stats:
          type: object
          properties:
            followers:
              type: integer
              minimum: 0
            following:
              type: integer
              minimum: 0
        loginMethods:
          type: array
          items:
            type: string
            enum:
              - password
              - apple
              - google
              - facebook
        onboarding:
          $ref: '#/components/schemas/Onboarding'
        consents:
          $ref: '#/components/schemas/ConsentStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Session:
      type: object
      description: Returned by every call that signs someone in.
      required:
        - tokens
        - session
        - user
        - isNewUser
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/User'
        isNewUser:
          type: boolean
          description: '`true` when this call created the account (sign-up, first social login, new guest).'
    OtpCode:
      type: string
      description: One-time code as typed by the user. Exactly 6 ASCII digits; leading zeros are significant.
      pattern: ^[0-9]{6}$
      examples:
        - '048213'
    ChallengeVerifyRequest:
      type: object
      required:
        - code
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/OtpCode'
    SignupEmailVerified:
      type: object
      required:
        - purpose
        - email
        - signupToken
        - signupTokenExpiresAt
      properties:
        purpose:
          type: string
          const: signup_email
        email:
          $ref: '#/components/schemas/Email'
        signupToken:
          type: string
          description: Single-use proof that this email was verified. Only valid for `POST /auth/signup/complete`, for 30 minutes.
        signupTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    PasswordResetVerified:
      type: object
      required:
        - purpose
        - resetToken
        - resetTokenExpiresAt
      properties:
        purpose:
          type: string
          const: password_reset
        resetToken:
          type: string
          description: Single-use token for `POST /auth/password-reset/complete`, valid for 15 minutes.
        resetTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    PhoneVerified:
      type: object
      required:
        - purpose
        - phoneNumber
        - verifiedAt
      properties:
        purpose:
          type: string
          const: phone_verification
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        verifiedAt:
          $ref: '#/components/schemas/Timestamp'
    EmailChanged:
      type: object
      description: The account's email is now `email` (verified); the previous address was sent a security notice.
      required:
        - purpose
        - email
        - verifiedAt
      properties:
        purpose:
          type: string
          const: change_email
        email:
          $ref: '#/components/schemas/Email'
        verifiedAt:
          $ref: '#/components/schemas/Timestamp'
    ChallengeVerification:
      description: Result of a correct code. Shape depends on the challenge purpose.
      oneOf:
        - $ref: '#/components/schemas/SignupEmailVerified'
        - $ref: '#/components/schemas/PasswordResetVerified'
        - $ref: '#/components/schemas/PhoneVerified'
        - $ref: '#/components/schemas/EmailChanged'
      discriminator:
        propertyName: purpose
        mapping:
          signup_email: '#/components/schemas/SignupEmailVerified'
          password_reset: '#/components/schemas/PasswordResetVerified'
          phone_verification: '#/components/schemas/PhoneVerified'
          change_email: '#/components/schemas/EmailChanged'
    LoginRequest:
      type: object
      required:
        - email
        - password
        - device
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
          description: Not checked against the current policy, so older passwords keep working.
        device:
          $ref: '#/components/schemas/DeviceInfo'
    SocialProvider:
      type: string
      enum:
        - apple
        - google
        - facebook
    SocialCredential:
      type: object
      description: |
        What the native provider SDK returned on the phone. The server verifies
        it with the provider; the app never sends a provider password.
        - apple: `idToken` (+ `authorizationCode` so the server can revoke the Apple token on account deletion) and `nonce`.
        - google: `idToken` (audience = our iOS/Android/web client IDs). When
          either the request or JWT contains a nonce, both must be present and
          the JWT nonce must equal the lowercase hex SHA-256 of the raw nonce.
          An email is accepted only when `email_verified` is boolean true;
          an email without that proof is `SOCIAL_EMAIL_UNVERIFIED`.
        - facebook: `accessToken` (checked with the Graph API `debug_token`).
          Limited Login `idToken` is reserved for a later release and currently
          returns `SOCIAL_TOKEN_INVALID`. Graph email is not proof of email
          ownership and is ignored: these accounts follow the no-email rule.
        Disabled providers (including Apple for now) return
        `SOCIAL_PROVIDER_UNSUPPORTED` before credential-form checks.
      required:
        - provider
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/SocialProvider'
        idToken:
          type: string
        accessToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
          description: The raw nonce whose SHA-256 was passed to the provider SDK. Prevents token replay.
        givenName:
          type: string
          maxLength: 50
          description: Apple only sends the name on the very first authorisation; forward it once.
        familyName:
          type: string
          maxLength: 50
    SocialLoginRequest:
      type: object
      required:
        - credential
        - device
      additionalProperties: false
      properties:
        credential:
          $ref: '#/components/schemas/SocialCredential'
        device:
          $ref: '#/components/schemas/DeviceInfo'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageTag'
    GuestSessionRequest:
      type: object
      required:
        - device
        - dateOfBirth
      additionalProperties: false
      properties:
        device:
          $ref: '#/components/schemas/DeviceInfo'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageTag'
    RefreshRequest:
      type: object
      required:
        - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional. When sent, that refresh token is revoked even if the access token has already expired.
    PasswordResetCompleteRequest:
      type: object
      required:
        - resetToken
        - newPassword
        - device
      additionalProperties: false
      properties:
        resetToken:
          type: string
        newPassword:
          $ref: '#/components/schemas/Password'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    ReauthenticateRequest:
      type: object
      description: Exactly one of `password` or `social` is required.
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
        social:
          $ref: '#/components/schemas/SocialCredential'
      oneOf:
        - required:
            - password
        - required:
            - social
    ReauthToken:
      type: object
      required:
        - reauthToken
        - expiresAt
      properties:
        reauthToken:
          type: string
          description: Send as `X-Reauth-Token` on sensitive calls (delete account, change email, unlink a login method). Valid 5 minutes.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    AccountDeletion:
      type: object
      required:
        - status
        - deletionScheduledAt
      properties:
        status:
          type: string
          const: pending_deletion
        deletionScheduledAt:
          $ref: '#/components/schemas/Timestamp'
    UserUpdate:
      type: object
      description: |
        Partial update (JSON Merge Patch semantics). Send only the fields that
        change; `null` clears a nullable field. At least one field is required.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 50
          description: Trimmed; inner whitespace collapsed; control and zero-width characters rejected (`NAME_INVALID`). Emoji allowed.
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageTag'
        storyTranslation:
          type: boolean
        location:
          type:
            - string
            - 'null'
          maxLength: 200
          description: |
            Trimmed and inner whitespace collapsed; then 1 to 100 characters.
            Empty after trimming, longer, or holding control or zero-width
            characters is `LOCATION_INVALID`. `null` clears it.
        accountPrivacy:
          $ref: '#/components/schemas/AccountPrivacy'
        locationSharing:
          $ref: '#/components/schemas/LocationSharing'
    PasswordChangeRequest:
      type: object
      required:
        - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
          description: Required when the account already has a password. Omitted when a social-only account sets its first password (then `X-Reauth-Token` is required).
        newPassword:
          $ref: '#/components/schemas/Password'
        signOutOtherSessions:
          type: boolean
          default: true
    OnboardingStepUpdate:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - completed
            - skipped
    Consent:
      type: object
      required:
        - documentType
        - version
        - acceptedAt
      properties:
        documentType:
          $ref: '#/components/schemas/LegalDocumentType'
        version:
          type: string
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
    ConsentList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
    ConsentRequest:
      type: object
      required:
        - documentType
        - version
        - accepted
      additionalProperties: false
      properties:
        documentType:
          $ref: '#/components/schemas/LegalDocumentType'
        version:
          type: string
          description: The version the user actually saw. Rejected with `LEGAL_VERSION_OUTDATED` if a newer one is live.
        accepted:
          type: boolean
          const: true
          description: Declining is not recorded; the app signs the user out instead.
    UserInterest:
      description: An interest the user follows, with when they followed it.
      allOf:
        - $ref: '#/components/schemas/Interest'
        - type: object
          required:
            - followedAt
          properties:
            followedAt:
              description: When the user first followed it (kept when the selection is replaced). `null` for selections saved before this was recorded.
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    UserInterests:
      type: object
      required:
        - data
        - updatedAt
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserInterest'
        updatedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    UserInterestsReplace:
      type: object
      required:
        - interestIds
      additionalProperties: false
      properties:
        interestIds:
          type: array
          description: The full new selection. Duplicates are ignored; an empty list clears it (Figma lets the user continue with nothing selected).
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
    NotificationSettings:
      type: object
      description: |
        Settings > Notifications. One switch per row; a user who never saved
        them gets every switch `true`.
      required:
        - likesAndComments
        - followRequests
        - profileEngagement
        - contributorMetrics
        - yourEngagement
        - newOrTrendingContent
      additionalProperties: false
      properties:
        likesAndComments:
          type: boolean
        followRequests:
          type: boolean
        profileEngagement:
          type: boolean
        contributorMetrics:
          type: boolean
        yourEngagement:
          type: boolean
        newOrTrendingContent:
          type: boolean
    NotificationSettingsUpdate:
      type: object
      description: Any subset of the switches; the others keep their value.
      minProperties: 1
      additionalProperties: false
      properties:
        likesAndComments:
          type: boolean
        followRequests:
          type: boolean
        profileEngagement:
          type: boolean
        contributorMetrics:
          type: boolean
        yourEngagement:
          type: boolean
        newOrTrendingContent:
          type: boolean
    ContentType:
      type: string
      enum:
        - playlist
        - album
        - song
        - story
    ContentBadge:
      type: string
      description: Label drawn on the artwork.
      enum:
        - trending
        - top10
    Content:
      type: object
      description: One playlist, album, song or story the user published.
      required:
        - id
        - type
        - title
        - image
        - year
        - songCount
        - durationSec
        - listens
        - badge
        - hidden
        - followersOnly
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ContentType'
        title:
          type: string
          examples:
            - Late Night Drive
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        year:
          type:
            - integer
            - 'null'
          description: Release year.
          examples:
            - 2024
        songCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of songs; playlists and albums only (`null` for songs and stories).
        durationSec:
          type: integer
          minimum: 0
          description: Total length in seconds.
        listens:
          type: integer
          minimum: 0
        badge:
          oneOf:
            - $ref: '#/components/schemas/ContentBadge'
            - type: 'null'
        hidden:
          type: boolean
          description: Privacy > Hide Content. Still listed to the owner unless `GET /me/content` is called with `hidden=false`.
        followersOnly:
          type: boolean
          description: Privacy > Restrict Content (only followers can play it).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ContentPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        page:
          $ref: '#/components/schemas/PageInfo'
    ContentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        hidden:
          type: boolean
        followersOnly:
          type: boolean
    HandPicked:
      type: object
      description: |
        The Profile's "Hand-picked by <name>" section: up to 3 of the user's own
        items, in the order the user chose (never computed). Items that no
        longer exist are left out; hidden and followers-only items are included
        with their flags (the owner's view).
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Content'
    HandPickedReplace:
      type: object
      required:
        - contentIds
      additionalProperties: false
      properties:
        contentIds:
          type: array
          description: |
            The whole new list, in the order to show: ids of the user's own
            content (`Content.id`), each at most once. `[]` clears it.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Id'
    ImagePurpose:
      type: string
      enum:
        - avatar
        - banner
    UploadIntentRequest:
      type: object
      required:
        - purpose
        - contentType
        - contentLength
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/ImagePurpose'
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/heic
            - image/heif
        contentLength:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Optional checksum; the storage rejects a body that does not match.
    UploadIntent:
      type: object
      required:
        - uploadId
        - uploadUrl
        - method
        - headers
        - expiresAt
      properties:
        uploadId:
          $ref: '#/components/schemas/Id'
        uploadUrl:
          type: string
          format: uri
          description: Pre-signed storage URL. Upload the raw bytes there directly, not to the API.
        method:
          type: string
          const: PUT
        headers:
          type: object
          description: Headers the upload request must carry exactly.
          additionalProperties:
            type: string
        expiresAt:
          description: The URL stops working at this time (15 minutes).
          $ref: '#/components/schemas/Timestamp'
    ImageCrop:
      type: object
      description: |
        Crop rectangle in the original image, as fractions of its width and
        height (0–1) after applying EXIF orientation. Avatars must be square in
        pixels; banners use the Figma band ratio (393:264, about 1.49:1) within 2%.
      required:
        - x
        - 'y'
        - width
        - height
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        'y':
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    ImageSetFromUpload:
      type: object
      required:
        - uploadId
        - crop
      additionalProperties: false
      properties:
        uploadId:
          $ref: '#/components/schemas/Id'
        crop:
          $ref: '#/components/schemas/ImageCrop'
    ImageSetMultipart:
      type: object
      required:
        - file
        - crop
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG, WebP or HEIC, at most 10 MB.
        crop:
          description: JSON-encoded `ImageCrop`.
          type: string
          contentMediaType: application/json
    SessionList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
    Identity:
      type: object
      required:
        - provider
        - linkedAt
      properties:
        provider:
          type: string
          enum:
            - password
            - apple
            - google
            - facebook
        email:
          description: Email the provider shared, if any (Apple may give a private relay address).
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        linkedAt:
          $ref: '#/components/schemas/Timestamp'
    IdentityList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    LinkIdentityRequest:
      type: object
      description: Links a social login to the signed-in account. Send either the `linkToken` from an `ACCOUNT_LINK_REQUIRED` error, or a fresh credential.
      additionalProperties: false
      properties:
        linkToken:
          type: string
        credential:
          $ref: '#/components/schemas/SocialCredential'
      oneOf:
        - required:
            - linkToken
        - required:
            - credential
    DeviceRegistration:
      type: object
      description: Push notification registration for one app install.
      required:
        - platform
        - pushProvider
        - pushToken
      additionalProperties: false
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        pushProvider:
          type: string
          enum:
            - apns
            - fcm
            - webpush
        pushToken:
          type: string
          minLength: 1
          maxLength: 4096
        appVersion:
          type: string
        locale:
          type: string
          maxLength: 35
        timeZone:
          type: string
          maxLength: 64
        notificationsEnabled:
          type: boolean
          description: Mirrors the OS permission so the server does not send to a silenced device.
    ArtistSummary:
      type: object
      description: |
        Who a song or album is by: the account that published it (`id` is that
        user's id). Their page is `GET /artists/{artistId}`.
      required:
        - id
        - name
        - image
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          examples:
            - Mara Quillon
        image:
          description: The artist's profile photo. The player shows it when the song has no artwork.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
    AlbumSummary:
      type: object
      description: The album a song is on (the player header and "Go to album").
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          examples:
            - Tallow Bay
    TranscriptLanguage:
      type: string
      description: |
        BCP 47 tag of a language a song's transcript is written in. Any
        language, not only the app's `supportedLanguages`.
      pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
      examples:
        - en
        - es
        - pt-BR
    UserSummary:
      type: object
      description: Another account as lists show it (a comment's author, a playlist's owner).
      required:
        - id
        - name
        - avatar
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type:
            - string
            - 'null'
          description: '`null` when the account has no name yet; the app shows its own placeholder.'
          examples:
            - Amelia Jane
        avatar:
          description: The profile photo; `null` draws the placeholder circle.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
    Comment:
      type: object
      description: |
        A comment on a song, or a reply to one. Replies are one level deep:
        they have no replies of their own.
      required:
        - id
        - parentId
        - author
        - text
        - createdAt
        - likeCount
        - likedByMe
        - replyCount
        - isMine
      properties:
        id:
          $ref: '#/components/schemas/Id'
        parentId:
          description: The top-level comment this replies to; `null` for a top-level comment.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        author:
          $ref: '#/components/schemas/UserSummary'
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: As saved (trimmed). Line breaks inside are kept.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        likeCount:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
          description: Always `false` for guests.
        replyCount:
          type: integer
          minimum: 0
          description: How many replies it has (can be more than `replies` holds). Always 0 on a reply.
        replies:
          type: array
          description: |
            On a top-level comment in `GET /songs/{songId}/comments`: its first
            replies, oldest first (up to 3). Empty in `Song.latestComment`.
            Absent on a reply.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Comment'
        isMine:
          type: boolean
          description: Whether the viewer wrote it (and so can delete it). Always `false` for guests.
    Song:
      type: object
      description: |
        One song as the player shows it. Songs are `Content` items of type
        `song` (same ids as `GET /me/content`). `liked` and `playable` are the
        viewer's. The audio address is not here: get it from
        `GET /songs/{songId}/playback` right before playing.
      required:
        - id
        - title
        - artist
        - album
        - image
        - durationMs
        - waveform
        - transcriptLanguages
        - listens
        - commentCount
        - latestComment
        - liked
        - followersOnly
        - playable
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          examples:
            - Kites Over Tallow Bay
        artist:
          $ref: '#/components/schemas/ArtistSummary'
        album:
          description: The album the song is on; `null` for a single (the header then shows the song title).
          oneOf:
            - $ref: '#/components/schemas/AlbumSummary'
            - type: 'null'
        image:
          description: |
            The artwork the server chose: the album's when the song is on one,
            else the song's own, with `palette` and `blurhash`. `null` when there
            is none: the app then shows `artist.image`, else its standard picture.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        durationMs:
          type: integer
          minimum: 0
          description: Length in milliseconds (the audio file's, once it is processed).
        waveform:
          type:
            - array
            - 'null'
          description: |
            Loudness across the song for the seek bar: levels from 0 (silence) to
            1 (loudest), evenly spaced in time. Any length: the server makes 128
            when the audio is uploaded, and the app resamples to the bars it
            draws. `null` until it is worked out.
          minItems: 1
          maxItems: 1024
          items:
            type: number
            minimum: 0
            maximum: 1
        transcriptLanguages:
          type: array
          description: Languages it has a transcript in, the original first. Empty when it has none (the app hides the flip button).
          items:
            $ref: '#/components/schemas/TranscriptLanguage'
        listens:
          type: integer
          minimum: 0
          description: Counted listens (the rule is under `POST /me/listens`).
        commentCount:
          type: integer
          minimum: 0
          description: Every comment on it, replies included (the "Comments (549)" tab label).
        latestComment:
          description: The newest top-level comment, for the pill under the player (its `replies` is empty); `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/Comment'
            - type: 'null'
        liked:
          type: boolean
          description: Whether the viewer has it in Liked songs. Always `false` for guests.
        followersOnly:
          type: boolean
          description: Restrict Content is on for the song or for its album, so only the artist's followers can play it.
        playable:
          type: boolean
          description: |
            Whether the viewer can play it now. `false` when it is followers-only
            and the viewer may not play it, or when its audio is not ready yet;
            `GET /songs/{songId}/playback` then answers `CONTENT_RESTRICTED` or
            `AUDIO_UNAVAILABLE`.
    SongList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Song'
    Playback:
      type: object
      description: |
        Where to stream a song from, for one play. `url` is short-lived (6
        hours) and answers HTTP Range requests, so the player can seek and
        resume. Fetch it right before playing and again once it has expired;
        never store or share it.
      required:
        - url
        - expiresAt
        - mimeType
        - sizeBytes
        - durationMs
      properties:
        url:
          type: string
          format: uri
          description: Signed address of the audio file. Works without the access token, until `expiresAt`.
        expiresAt:
          description: When `url` stops working (6 hours after this answer). After that it answers 403.
          $ref: '#/components/schemas/Timestamp'
        mimeType:
          type: string
          description: The audio file's type.
          examples:
            - audio/mp4
            - audio/mpeg
        sizeBytes:
          type: integer
          minimum: 1
          description: Size of the audio file.
        durationMs:
          type: integer
          minimum: 0
          description: Length of the audio file in milliseconds.
    TranscriptWord:
      type: object
      description: One word, heard from `startMs` up to (not including) `endMs`.
      required:
        - text
        - startMs
        - endMs
      properties:
        text:
          type: string
          minLength: 1
          description: The word as shown, with its punctuation. Never blank.
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
          description: Never before `startMs`.
    TranscriptWordsLine:
      type: object
      description: A line whose words each have their own times.
      required:
        - words
      properties:
        words:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TranscriptWord'
    TranscriptTextLine:
      type: object
      description: A line with one time for the whole line; the app spreads it evenly over the line's words.
      required:
        - text
        - startMs
        - endMs
      properties:
        text:
          type: string
          minLength: 1
          description: The line as shown. Never blank.
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
          description: Never before `startMs`.
    TranscriptLine:
      description: One line of a transcript (it may wrap on screen). Either timed words or one line-level time.
      oneOf:
        - $ref: '#/components/schemas/TranscriptWordsLine'
        - $ref: '#/components/schemas/TranscriptTextLine'
    Transcript:
      type: object
      description: |
        The words of a song with their times, for the player's live transcript.
        The shape the app parses (`TimedTranscript.fromJson`). Times are whole
        milliseconds from the start of the song; words never go back in time
        (each starts at or after the start of the one before, across lines).
      required:
        - language
        - translatedFrom
        - lines
        - availableLanguages
      properties:
        language:
          $ref: '#/components/schemas/TranscriptLanguage'
        translatedFrom:
          description: |
            The language the song is in when this text is a translation (the
            "Translated from English" pill); `null` for the original.
          oneOf:
            - $ref: '#/components/schemas/TranscriptLanguage'
            - type: 'null'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TranscriptLine'
        availableLanguages:
          type: array
          description: Every language the song has a transcript in, the original first (the same list as `Song.transcriptLanguages`).
          minItems: 1
          items:
            $ref: '#/components/schemas/TranscriptLanguage'
    Album:
      type: object
      description: An album and its songs. Albums are `Content` items of type `album` (same ids).
      required:
        - id
        - title
        - artist
        - image
        - year
        - durationMs
        - songCount
        - songs
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          examples:
            - Tallow Bay
        artist:
          $ref: '#/components/schemas/ArtistSummary'
        image:
          description: The album's artwork, with `palette` and `blurhash`; `null` when it has none.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        year:
          type:
            - integer
            - 'null'
          description: Release year.
          examples:
            - 2026
        durationMs:
          type: integer
          minimum: 0
          description: Total length of its songs in milliseconds.
        songCount:
          type: integer
          minimum: 0
        songs:
          type: array
          description: Every song on it, in album order.
          items:
            $ref: '#/components/schemas/Song'
    Playlist:
      type: object
      description: |
        A playlist's header; its songs are paged by
        `GET /playlists/{playlistId}/songs`. Playlists are `Content` items of
        type `playlist` (same ids).
      required:
        - id
        - title
        - owner
        - image
        - songCount
        - durationMs
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          examples:
            - Rainy Commute
        owner:
          $ref: '#/components/schemas/UserSummary'
        image:
          description: The playlist's own picture; `null` draws the app's 2x2 mosaic.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        songCount:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
          description: Total length of its songs in milliseconds.
        updatedAt:
          description: When a song was last added to or taken out of it.
          $ref: '#/components/schemas/Timestamp'
    SongPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Song'
        page:
          $ref: '#/components/schemas/PageInfo'
    ListenSource:
      type: object
      description: |
        Where the song was played from. A `playlist` or `liked_songs` source
        also moves that entry's `playedAt` in the listener's library (the
        "Recently played" sort).
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - album
            - playlist
            - liked_songs
            - song
          description: '`song` when it was played on its own (a link, a single).'
        id:
          description: |
            The album's or playlist's id, for `album` and `playlist` (not sent
            for the others). A source that needs an id and has none is ignored;
            the listen itself still counts.
          $ref: '#/components/schemas/Id'
    ListenEvent:
      type: object
      description: One song that stopped being the current one (it finished, was skipped or replaced, or the app closed).
      required:
        - songId
        - listenedMs
        - completed
        - endedAt
      additionalProperties: false
      properties:
        songId:
          $ref: '#/components/schemas/Id'
        listenedMs:
          type: integer
          minimum: 0
          maximum: 86400000
          description: |
            Time actually played, in the song's own time: seeking does not add
            to it, and pauses do not count.
        completed:
          type: boolean
          description: Whether it played to the end.
        endedAt:
          description: When it stopped being the current song, by the device's clock.
          $ref: '#/components/schemas/Timestamp'
        source:
          $ref: '#/components/schemas/ListenSource'
    ListenBatch:
      type: object
      required:
        - events
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ListenEvent'
    LikedSong:
      description: A song in Liked songs, with when the user liked it.
      allOf:
        - $ref: '#/components/schemas/Song'
        - type: object
          required:
            - likedAt
          properties:
            likedAt:
              $ref: '#/components/schemas/Timestamp'
    LikedSongPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LikedSong'
        page:
          $ref: '#/components/schemas/PageInfo'
    LibraryPlaylist:
      type: object
      description: |
        One playlist in the user's library, as Add to Playlist lists it: the
        user's own playlists, playlists saved from others, and the Liked songs
        entry (`isLikedSongs: true`).
      required:
        - id
        - title
        - image
        - artwork
        - songCount
        - updatedAt
        - savedAt
        - playedAt
        - isLikedSongs
        - editable
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          description: For the Liked songs entry this is `Liked songs` (English); the app shows its own words instead.
          examples:
            - Rainy Commute
        image:
          description: The playlist's own picture; `null` draws the app's 2x2 mosaic of `artwork`.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        artwork:
          type: array
          maxItems: 4
          description: |
            Covers for the app's 2x2 mosaic when the playlist has no `image`:
            the artwork of its first songs by playlist position, as `Song.image`
            gives it (the album's artwork, else the song's own), skipping songs
            that have none and covers already listed, up to 4. Only the first 20
            songs are looked at. Always present; `[]` when none has artwork, and
            always `[]` for the Liked songs entry (the app draws its own).
          items:
            $ref: '#/components/schemas/Image'
        songCount:
          type: integer
          minimum: 0
        updatedAt:
          description: When a song was last added to or taken out of it ("Recently updated").
          $ref: '#/components/schemas/Timestamp'
        savedAt:
          description: When it joined the library ("Recently saved"); for the user's own playlists, when it was created.
          $ref: '#/components/schemas/Timestamp'
        playedAt:
          description: When the user last played from it ("Recently played", from `POST /me/listens`); `null` if never.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        isLikedSongs:
          type: boolean
          description: Marks the one Liked songs entry, which only the heart fills. Exactly one entry has it.
        editable:
          type: boolean
          description: |
            `true` for the user's own playlists: only these can take songs (Add
            to Playlist). `false` for saved playlists and for Liked songs.
    LibraryPlaylistPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryPlaylist'
        page:
          $ref: '#/components/schemas/PageInfo'
    SongLibraryState:
      type: object
      description: The player's heart and "+" states for one song.
      required:
        - liked
        - playlistIds
      properties:
        liked:
          type: boolean
          description: Whether the song is in Liked songs.
        playlistIds:
          type: array
          description: The user's editable playlists that hold the song (Liked songs not included), in no particular order.
          items:
            $ref: '#/components/schemas/Id'
    SongPlaylists:
      type: object
      description: |
        The user's playlists, other than Liked songs, that hold a song. Sent
        to set them, answered as saved. When sent, duplicates and the Liked
        songs id are ignored.
      required:
        - playlistIds
      additionalProperties: false
      properties:
        playlistIds:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Id'
    ReleaseKind:
      type: string
      description: |
        What an artist's release is. Only `album` and `song` for now; more kinds
        (stories, playlists) may be added, so clients skip rows of a kind they
        do not know.
      enum:
        - album
        - song
    ArtistRelease:
      type: object
      description: |
        One row of an artist's releases. The id is the album's or the song's
        (`GET /albums/{albumId}`, `GET /songs/{songId}`).
      required:
        - id
        - kind
        - title
        - releasedAt
        - plays
        - songCount
        - image
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/ReleaseKind'
        title:
          type: string
          examples:
            - Tallow Bay
        releasedAt:
          description: When it was published.
          $ref: '#/components/schemas/Timestamp'
        plays:
          type: integer
          minimum: 0
          description: Counted listens; for an album, the sum of its songs'.
        songCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: An album's songs (as `Album.songCount`); `null` for a song.
        image:
          description: |
            The artwork, with `palette` and `blurhash`: an album's own; a song's
            as `Song.image` (its album's when it is on one, else its own). `null`
            when there is none.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
    Artist:
      type: object
      description: An artist's page (the account that published the songs) for this viewer.
      required:
        - id
        - name
        - avatar
        - banner
        - genre
        - followerCount
        - followingCount
        - following
        - releases
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: As `ArtistSummary.name` (`''` when the account has no name).
          examples:
            - Mara Quillon
        avatar:
          description: The profile photo (the round picture); `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        banner:
          description: The profile banner (the picture at the top); `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        genre:
          type:
            - string
            - 'null'
          description: The line over the name. Not stored yet, so always `null` (the app hides the line).
        followerCount:
          type: integer
          minimum: 0
          description: How many accounts follow the artist.
        followingCount:
          type: integer
          minimum: 0
          description: How many artists the artist follows.
        following:
          type: boolean
          description: Whether the viewer follows the artist. Always `false` for guests and for the artist themselves.
        releases:
          type: array
          description: Albums and songs, newest first (`releasedAt`, then `id`), at most 200; hidden ones left out.
          maxItems: 200
          items:
            $ref: '#/components/schemas/ArtistRelease'
    CommentPage:
      type: object
      required:
        - data
        - page
        - commentCount
      properties:
        data:
          type: array
          description: Top-level comments, newest first.
          items:
            $ref: '#/components/schemas/Comment'
        page:
          $ref: '#/components/schemas/PageInfo'
        commentCount:
          type: integer
          minimum: 0
          description: Every comment on the song, replies included (`page.total` counts top-level comments only).
    CommentCreate:
      type: object
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Trimmed (line breaks inside are kept), then it must be 1 to 500
            characters; otherwise `VALIDATION_FAILED` with `field` `/text`.
    CommentReplyPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          description: Replies, oldest first.
          items:
            $ref: '#/components/schemas/Comment'
        page:
          $ref: '#/components/schemas/PageInfo'
    CommentLike:
      type: object
      description: A comment's likes after a like or unlike.
      required:
        - likeCount
        - likedByMe
      properties:
        likeCount:
          type: integer
          minimum: 0
        likedByMe:
          type: boolean
  parameters:
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      description: Sent on every request. Used for minimum-version checks and analytics.
      schema:
        $ref: '#/components/schemas/Platform'
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: App version (semver). Builds below `minimumSupportedVersion` get `426 UPGRADE_REQUIRED`.
      schema:
        type: string
        examples:
          - 1.4.0
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language for error titles, legal summaries and country names. Falls back to English.
      schema:
        type: string
        examples:
          - hi-IN, en;q=0.8
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response. The server answers `304 Not Modified` when nothing changed.
      schema:
        type: string
    LegalDocumentType:
      name: documentType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LegalDocumentType'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`page.nextCursor` from the previous page. Omit for the first page.'
      schema:
        type: string
        maxLength: 512
    InterestId:
      name: interestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ClientInstallation:
      name: X-Installation-Id
      in: header
      required: true
      description: |
        The install's random UUID (same as `device.installationId`). Challenges
        are bound to it: a code can only be verified or resent from the install
        that requested it.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Random UUID per user action (reuse it when retrying that same action).
        The server stores the first response for 24 hours and replays it for
        retries with the same key, so a flaky network never sends two codes,
        creates two accounts or uploads twice. The same key with a different
        body returns `422 IDEMPOTENCY_KEY_REUSED`; a retry while the first call
        is still running returns `409 IDEMPOTENCY_IN_PROGRESS`.
      schema:
        type: string
        format: uuid
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: From `POST /auth/reauthenticate`, valid 5 minutes. Proves the user just re-entered their password.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag of the profile the client last read. When sent and stale, the
        update is rejected with `412` so one device cannot silently overwrite
        another's edit.
      schema:
        type: string
    OnboardingStep:
      name: step
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OnboardingStepName'
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SocialProvider'
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SongId:
      name: songId
      in: path
      required: true
      description: A song's id (`Content.id` of an item of type `song`).
      schema:
        $ref: '#/components/schemas/Id'
    AlbumId:
      name: albumId
      in: path
      required: true
      description: An album's id (`Content.id` of an item of type `album`).
      schema:
        $ref: '#/components/schemas/Id'
    PlaylistId:
      name: playlistId
      in: path
      required: true
      description: A playlist's id (`Content.id` of an item of type `playlist`).
      schema:
        $ref: '#/components/schemas/Id'
    ArtistId:
      name: artistId
      in: path
      required: true
      description: An artist's id (`Song.artist.id`, the id of the account that published the song).
      schema:
        $ref: '#/components/schemas/Id'
    CommentId:
      name: commentId
      in: path
      required: true
      description: A comment's or a reply's id.
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    ETag:
      description: Version of the returned resource, for `If-None-Match` / `If-Match`.
      schema:
        type: string
    CacheControl:
      description: Caching rules for catalog data.
      schema:
        type: string
        examples:
          - public, max-age=3600
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RateLimit:
      description: |
        Current rate-limit window (IETF `RateLimit` header draft), e.g.
        `limit=5, remaining=2, reset=1800`. Informational; the client should
        rely on `Retry-After` when it gets a 429.
      schema:
        type: string
    RequestId:
      description: Unique id of this request, also inside error bodies. Log it on the client for support.
      schema:
        type: string
  responses:
    NotModified:
      description: Unchanged since the `If-None-Match` ETag; use the cached copy.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    UpgradeRequired:
      description: This app version is no longer supported (`UPGRADE_REQUIRED`). The app shows a blocking "Update Bondfire" screen with a store link.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/upgrade-required
            title: Update required
            status: 426
            code: UPGRADE_REQUIRED
            requestId: req_01J8Z3K5QH
            meta:
              minimumVersion: 1.2.0
    TooManyRequests:
      description: Rate limited. Wait `Retry-After` seconds; do not retry sooner.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/resend-too-soon
            title: Please wait before requesting another code
            status: 429
            code: RESEND_TOO_SOON
            retryAfterSeconds: 22
            requestId: req_01J8Z3K5QH
    InternalError:
      description: Unexpected server failure (`INTERNAL_ERROR`). Safe to retry idempotent calls with backoff.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        A dependency is down (`SERVICE_UNAVAILABLE`, `EMAIL_DELIVERY_FAILED`,
        `SMS_DELIVERY_FAILED`) or planned `MAINTENANCE`. Retry after `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to this caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            requestId: req_01J8Z3K5QH
    Unauthorized:
      description: |
        Missing, invalid or expired credentials. On `TOKEN_EXPIRED` the app
        refreshes once and retries; on `REAUTH_REQUIRED` it asks for the
        password again (`POST /auth/reauthenticate`) and retries; on any other
        401 it signs the user out.
      headers:
        WWW-Authenticate:
          description: '`Bearer error="invalid_token"` when a token was sent.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/token-expired
            title: Access token expired
            status: 401
            code: TOKEN_EXPIRED
            requestId: req_01J8Z3K5QH
    Unprocessable:
      description: The request is well-formed but a value is not acceptable. `errors[]` lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/validation-failed
            title: Some details need fixing
            status: 422
            code: VALIDATION_FAILED
            requestId: req_01J8Z3K5QH
            errors:
              - field: /password
                code: PASSWORD_POLICY_VIOLATION
                message: Add an uppercase letter and a symbol.
                meta:
                  unmetRules:
                    - uppercase
                    - symbol
    BadRequest:
      description: The body is not valid JSON, or a required header is missing (`MALFORMED_REQUEST`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/malformed-request
            title: Malformed request
            status: 400
            code: MALFORMED_REQUEST
            detail: The request body is not valid JSON.
            requestId: req_01J8Z3K5QH
    Conflict:
      description: The request clashes with the current state (already taken, already used, stale version).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/email-taken
            title: Email already registered
            status: 409
            code: EMAIL_TAKEN
            detail: An account already uses this email. Try signing in instead.
            requestId: req_01J8Z3K5QH
    Gone:
      description: The resource existed but has expired and cannot be used again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/challenge-expired
            title: Code expired
            status: 410
            code: CHALLENGE_EXPIRED
            detail: This code has expired. Request a new one.
            requestId: req_01J8Z3K5QH
    Locked:
      description: Temporarily locked after too many attempts. Wait `retryAfterSeconds`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/account-locked
            title: Too many attempts
            status: 423
            code: ACCOUNT_LOCKED
            detail: Try again in 15 minutes, or reset your password.
            retryAfterSeconds: 900
            requestId: req_01J8Z3K5QH
    Forbidden:
      description: Signed in, but not allowed (for example a guest calling an account-only endpoint).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bondfire.app/errors/guest-not-allowed
            title: Create an account to do this
            status: 403
            code: GUEST_NOT_ALLOWED
            requestId: req_01J8Z3K5QH
    NoContent:
      description: Done. No body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    PreconditionFailed:
      description: '`If-Match` did not match; the resource changed on another device. Re-read and retry.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Wrong `Content-Type`, or a file type that is not accepted (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body or file larger than allowed (`PAYLOAD_TOO_LARGE`). `meta.maxBytes` holds the limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
