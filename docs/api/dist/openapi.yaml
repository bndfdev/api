openapi: 3.1.0
info:
  title: Bondfire API
  version: 1.0.0-draft.1
  summary: Accounts, onboarding, profile and catalog for the Bondfire app.
  description: |
    **Status: draft for review.** Contract between the Bondfire app and the
    `api` server for everything the onboarding flow needs. Design notes,
    edge cases and the migration from today's endpoints are in
    `docs/api/README.md`.

    ## Conventions (apply to every endpoint)

    - **Base URL** `https://api.bondfire.app/v1`. Breaking changes ship as
      `/v2`; additive changes (new fields, new error codes, new enum values)
      do not, so clients must ignore unknown fields and handle unknown enum
      values.
    - **JSON only**, UTF-8, `camelCase` fields. Timestamps are RFC 3339 UTC;
      calendar dates (date of birth) are `YYYY-MM-DD`. Absent and `null`
      mean "not set".
    - **Headers on every request:** `X-Client-Platform`, `X-Client-Version`
      and `X-Installation-Id` (the install's random UUID). Builds below the
      minimum version get `426 UPGRADE_REQUIRED`. `Accept-Language` picks
      the language of human-readable messages.
    - **Auth:** `Authorization: Bearer <accessToken>` (15-minute JWT). Get
      new tokens with `POST /auth/token/refresh` (refresh tokens rotate and
      are single-use). Guests use the same scheme with limited rights.
    - **Errors** are RFC 9457 problem details (`application/problem+json`)
      with a stable `code`. Branch on `code`, never on text.
    - **Retries:** send `Idempotency-Key` (UUID) on calls that send codes,
      create accounts or upload, and reuse it when retrying the same action.
    - **Rate limits:** `429` with `Retry-After` (seconds). Limits per
      operation are listed under `x-rate-limit`.
    - **Pagination:** cursor based (`limit`, `cursor` → `page.nextCursor`,
      `page.hasMore`).
    - **Every response** carries `X-Request-Id`; errors repeat it as
      `requestId`.
    - **Transport:** HTTPS only (HSTS). Tokens, codes and passwords are
      never logged.
  contact:
    name: Bondfire engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.bondfire.app/v1
    description: Production
  - url: https://staging-api.bondfire.app/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Meta
    description: Health, app configuration.
  - name: Auth
    description: Sign-up, one-time codes, login, social login, guest, tokens, password reset.
  - name: Account
    description: The signed-in user's profile, password, phone and deletion.
  - name: Onboarding
    description: Server-side onboarding progress so the flow resumes on any device.
  - name: Legal
    description: Terms and privacy documents and the user's acceptance.
  - name: Interests
    description: The interest catalog and the user's selection.
  - name: Catalog
    description: Reference data (countries).
  - name: Media
    description: Profile photo and banner.
  - name: Sessions
    description: Signed-in devices and linked sign-in methods.
  - name: Devices
    description: Push notification registration.
paths:
  /health:
    servers:
      - url: https://api.bondfire.app
      - url: https://staging-api.bondfire.app
      - url: http://localhost:3000
    get:
      operationId: getHealth
      tags:
        - Meta
      summary: Liveness check (unversioned)
      description: For load balancers. Answers without touching the database.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        '429':
          description: Too many probes from one address (edge rate limit).
  /health/ready:
    servers:
      - url: https://api.bondfire.app
      - url: https://staging-api.bondfire.app
      - url: http://localhost:3000
    get:
      operationId: getReadiness
      tags:
        - Meta
      summary: Readiness check (unversioned)
      description: Checks the database and required providers. `503` takes the instance out of rotation.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/readiness'
        '429':
          description: Too many probes from one address (edge rate limit).
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/readiness'
  /config:
    get:
      operationId: getConfig
      tags:
        - Meta
      summary: App configuration
      description: |
        First call on every launch (before sign-in). Supplies the password
        policy, code timings, minimum age, languages, legal versions, feature
        switches and upload limits, so none of these are hardcoded in the app.
        Supports `If-None-Match`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current configuration.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
              example:
                minimumSupportedVersion:
                  ios: 1.0.0
                  android: 1.0.0
                  web: 1.0.0
                latestVersion:
                  ios: 1.4.0
                  android: 1.4.0
                  web: 1.4.0
                passwordPolicy:
                  minLength: 12
                  maxLength: 128
                  requireUppercase: true
                  requireLowercase: false
                  requireDigit: true
                  requireSymbol: true
                otp:
                  length: 6
                  ttlSeconds: 600
                  resendCooldownSeconds: 30
                  maxAttempts: 5
                minimumAge: 13
                supportedLanguages:
                  - tag: en
                    name: English
                    nativeName: English
                  - tag: es
                    name: Spanish
                    nativeName: Español
                  - tag: fr
                    name: French
                    nativeName: Français
                  - tag: de
                    name: German
                    nativeName: Deutsch
                  - tag: hi
                    name: Hindi
                    nativeName: हिन्दी
                legal:
                  termsVersion: '2026-09-01'
                  privacyVersion: '2026-09-01'
                features:
                  guestMode: true
                  phoneVerificationRequired: true
                  socialLogin:
                    apple: false
                    google: false
                    facebook: false
                limits:
                  maxInterests: 100
                  avatarMaxBytes: 10485760
                  bannerMaxBytes: 10485760
                  nameMaxLength: 50
        '304':
          $ref: '#/components/responses/NotModified'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /legal/{documentType}:
    get:
      operationId: getLegalDocument
      tags:
        - Legal
      summary: Current version of the terms or privacy policy
      description: |
        Feeds the Terms and Conditions screen (Figma 1270:11938): `title`,
        `summary` excerpt and a link to the full text. Localised by
        `Accept-Language` when a translation exists.

        Errors: `LEGAL_DOCUMENT_NOT_FOUND` (404).
      security: []
      parameters:
        - $ref: '#/components/parameters/LegalDocumentType'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The live document.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /countries:
    get:
      operationId: listCountries
      tags:
        - Catalog
      summary: Countries for the phone picker
      description: |
        Every country with dial code and flag, sorted by localised name, plus
        a `defaultCountryCode` guessed from the IP. Small and rarely changes:
        cache with `ETag` (`max-age` 1 day). Countries sharing a dial code
        (e.g. +1) are separate entries.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Countries.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryList'
        '304':
          $ref: '#/components/responses/NotModified'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /interests/featured:
    get:
      operationId: listFeaturedInterests
      tags:
        - Interests
      summary: Curated interests for the onboarding grid
      description: |
        "Tell us what you're interested in" (Figma 1261:36247). A curated,
        region-aware list; `presentation.size` says which items are drawn as
        the large card. Guests allowed. Items already selected by the user
        are still returned (the app marks them).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of featured interests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /interests/search:
    get:
      operationId: searchInterests
      tags:
        - Interests
      summary: Search interests
      description: |
        Search Interests screen (Figma 1372:42256).

        - `q` is trimmed; empty `q` returns popular items for the chosen kinds.
        - Matching ignores case and accents ("Coastin" finds "Coastin’") and
          supports prefixes as the user types; the app debounces (~300 ms)
          and cancels stale requests.
        - Results are paginated with a cursor; a cursor from a different
          query or older than 24 hours is `CURSOR_INVALID`.

        Errors: `SEARCH_QUERY_INVALID`, `CURSOR_INVALID` (422).
      security:
        - bearerAuth: []
      x-rate-limit:
        - key: account
          limit: 120
          window: 1m
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Search text.
        - name: kind
          in: query
          required: false
          description: Filter row (Figma icons). Repeat to combine, e.g. `kind=artist&kind=album`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 9
            items:
              $ref: '#/components/schemas/InterestKind'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - relevance
              - popular
              - recent
              - alphabetical
            default: relevance
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: A page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPage'
              example:
                data:
                  - id: int_paradise
                    kind: album
                    title: Paradise
                    subtitle: Daya
                    image:
                      url: https://cdn.bondfire.app/i/paradise.jpg
                      width: 512
                      height: 512
                      status: ready
                      blurhash: LEHV6nWB2yk8pyo0adR*.7kCMdnj
                page:
                  nextCursor: eyJvIjoyMH0
                  hasMore: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /interests/{interestId}:
    get:
      operationId: getInterest
      tags:
        - Interests
      summary: Get one interest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The interest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/email/availability:
    post:
      operationId: checkEmailAvailability
      tags:
        - Auth
      summary: Check whether an email can be used to sign up
      description: |
        Used by the Email address screen (Figma 1261:31574) before sending a
        code, so the user sees "already registered" without waiting for mail.

        **Enumeration trade-off:** this reveals whether an address has an
        account. It is limited hard (see `x-rate-limit`) and returns the same
        timing for both answers. If product prefers full privacy, the app can
        skip this call and rely on `POST /auth/signup/email`.

        Errors: `EMAIL_INVALID`, `EMAIL_DOMAIN_NOT_ALLOWED` (422),
        `RATE_LIMITED` (429).
      security: []
      x-rate-limit:
        - key: ip
          limit: 30
          window: 1h
        - key: installation
          limit: 20
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Availability of the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAvailability'
              examples:
                available:
                  value:
                    email: new.user@example.com
                    available: true
                    suggestion: null
                taken:
                  value:
                    email: amelia.jane@example.com
                    available: false
                    suggestion: null
                typo:
                  value:
                    email: amelia.jane@gmial.com
                    available: true
                    suggestion: amelia.jane@gmail.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/signup/email:
    post:
      operationId: startEmailSignup
      tags:
        - Auth
      summary: Send a sign-up code to an email address
      description: |
        Starts sign-up (Figma 1261:31574 → 1261:31607). Sends a 6-digit code
        valid for 10 minutes and returns the challenge to verify it.

        - Calling again for the same email and install returns the **same
          challenge** (no new code) until it expires, so a double tap never
          sends two emails.
        - The email is normalised before the check (trimmed, domain lowercased).
        - Nothing is created in the user table until `POST /auth/signup/complete`.

        Errors: `EMAIL_TAKEN` (409), `EMAIL_INVALID`,
        `EMAIL_DOMAIN_NOT_ALLOWED` (422), `SEND_LIMIT_REACHED` (429, 5 sends
        per address per 24 h), `EMAIL_DELIVERY_FAILED` (503).
      security: []
      x-rate-limit:
        - key: email
          limit: 5
          window: 24h
        - key: ip
          limit: 20
          window: 1h
        - key: installation
          limit: 10
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Code sent (or an unexpired one already exists).
          headers:
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example:
                id: chl_01J8Z4A7
                purpose: signup_email
                channel: email
                destination: a•••••e@example.com
                codeLength: 6
                expiresAt: '2026-09-27T10:25:00Z'
                resendAvailableAt: '2026-09-27T10:15:30Z'
                attemptsRemaining: 5
                sendsRemaining: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/signup/complete:
    post:
      operationId: completeSignup
      tags:
        - Auth
      summary: Create the account (set password) and sign in
      description: |
        Create password screen (Figma 1261:31642). Creates the user with the
        verified email and returns a session. The `signupToken` is single-use.

        **Guest upgrade:** when called with a guest access token in
        `Authorization`, the guest's date of birth, language, interests and
        consents move to the new account and the guest session ends.

        Errors: `SIGNUP_TOKEN_INVALID`, `SIGNUP_TOKEN_EXPIRED` (401),
        `EMAIL_TAKEN` (409, someone finished sign-up for this email first),
        `PASSWORD_POLICY_VIOLATION` (422, `errors[0].meta.unmetRules`),
        `PASSWORD_COMPROMISED`, `LANGUAGE_UNSUPPORTED` (422).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
      responses:
        '201':
          description: Account created and signed in. `user.onboarding.nextStep` is `phone_verified`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/challenges/{challengeId}:
    get:
      operationId: getChallenge
      tags:
        - Auth
      summary: Get a challenge's current state
      description: |
        Lets the code screen restore its countdown and attempts after the app
        was killed or the phone rotated. Public for sign-up and reset
        challenges; phone challenges need the owner's access token.

        Errors: `CHALLENGE_NOT_FOUND` (404, also when called from another
        install), `CHALLENGE_EXPIRED` (410).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/challenges/{challengeId}/resend:
    post:
      operationId: resendChallenge
      tags:
        - Auth
      summary: Send a new code for the same challenge
      description: |
        "Send again" on the code screens. Allowed once `resendAvailableAt` has
        passed (30 s cooldown). The new code replaces the old one, the
        attempt counter resets and `expiresAt` moves to 10 minutes from now.

        Errors: `CHALLENGE_NOT_FOUND` (404), `CHALLENGE_ALREADY_USED` (409),
        `CHALLENGE_EXPIRED` (410, start over), `CHALLENGE_LOCKED` (423),
        `RESEND_TOO_SOON` / `SEND_LIMIT_REACHED` (429),
        `EMAIL_DELIVERY_FAILED` / `SMS_DELIVERY_FAILED` (503).
      security:
        - {}
        - bearerAuth: []
      x-rate-limit:
        - key: challenge
          limit: 1
          window: 30s
        - key: destination
          limit: 5
          window: 24h
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: New code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/challenges/{challengeId}/verify:
    post:
      operationId: verifyChallenge
      tags:
        - Auth
      summary: Verify a one-time code
      description: |
        The code screens auto-submit at 6 digits. A correct code consumes the
        challenge and returns what it unlocks (see `ChallengeVerification`):
        a `signupToken`, a `resetToken`, or a verified phone number.

        - Codes are compared in constant time; only a hash is stored.
        - After 5 wrong codes the challenge locks (`CHALLENGE_LOCKED`); the
          user must request a new code, which counts toward the daily limit.
        - Leading/trailing spaces are trimmed; anything but 6 digits is
          `CODE_FORMAT_INVALID` and does **not** use up an attempt.
        - Phone challenges need the owner's access token. If another account
          verified the same number in the meantime, this returns `PHONE_TAKEN`.

        Errors: `CHALLENGE_NOT_FOUND` (404), `CHALLENGE_ALREADY_USED`,
        `PHONE_TAKEN` (409), `CHALLENGE_EXPIRED` (410), `CODE_INCORRECT`
        (422, `meta.attemptsRemaining`), `CODE_FORMAT_INVALID` (422),
        `CHALLENGE_LOCKED` (423).
      security:
        - {}
        - bearerAuth: []
      x-rate-limit:
        - key: challenge
          limit: 5
          window: challenge-lifetime
        - key: ip
          limit: 60
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeVerifyRequest'
      responses:
        '200':
          description: Code accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeVerification'
              examples:
                signup:
                  value:
                    purpose: signup_email
                    email: amelia.jane@example.com
                    signupToken: sgt_2b7c…
                    signupTokenExpiresAt: '2026-09-27T10:45:00Z'
                reset:
                  value:
                    purpose: password_reset
                    resetToken: rst_9f1a…
                    resetTokenExpiresAt: '2026-09-27T10:30:00Z'
                phone:
                  value:
                    purpose: phone_verification
                    phoneNumber: '+14155550123'
                    verifiedAt: '2026-09-27T10:16:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          description: Wrong or malformed code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bondfire.app/errors/code-incorrect
                title: That code isn't right
                status: 422
                code: CODE_INCORRECT
                requestId: req_01J8Z3K5QH
                meta:
                  attemptsRemaining: 3
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in with email and password
      description: |
        Enter email → Enter password screens (Figma 1261:31330, 1372:27858).

        - Wrong email and wrong password give the **same** error and timing
          (`INVALID_CREDENTIALS`), so an attacker cannot learn which emails exist.
        - An account that only uses Apple/Google/Facebook has no password and
          also gets `INVALID_CREDENTIALS`.
        - Lockout: 5 failures in 15 minutes lock password login for 15
          minutes (`ACCOUNT_LOCKED`, 423 + `Retry-After`). A password reset
          clears the lock. Limits are per account **and** per IP, so one
          attacker cannot lock out every user.
        - Signing in while `pending_deletion` cancels the deletion.

        Errors: `INVALID_CREDENTIALS` (401), `ACCOUNT_SUSPENDED` (403),
        `ACCOUNT_LOCKED` (423), `RATE_LIMITED` (429).
      security: []
      x-rate-limit:
        - key: account
          limit: 5
          window: 15m
        - key: ip
          limit: 50
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social:
    post:
      operationId: socialLogin
      tags:
        - Auth
      summary: Sign in or sign up with Apple, Google or Facebook
      description: |
        The app runs the provider's native SDK and sends the result here; the
        server verifies it with the provider (signature, audience, expiry,
        nonce) and issues our own session. No Firebase involved.

        Account rules:
        1. Provider account already linked → sign in.
        2. Not linked, and no Bondfire account has that email → create one
           (`isNewUser: true`, `201`). Onboarding continues at date of birth.
        3. Not linked, but a password account has the same **verified** email
           → `409 ACCOUNT_LINK_REQUIRED`. `meta.linkToken` (10 min) lets the
           user sign in with their password and then call
           `POST /me/identities` to link. Never auto-link silently.
        4. Provider gives no email (Apple "Hide My Email" relay is fine;
           Facebook may give none) → account without email; the user can add
           one later.
        5. Provider says the email is unverified → `SOCIAL_EMAIL_UNVERIFIED`.

        Apple only sends the name on first authorisation; the app forwards
        `givenName`/`familyName` once. On account deletion the server revokes
        the Apple token (App Store requirement).

        Errors: `SOCIAL_TOKEN_INVALID`, `SOCIAL_NONCE_MISMATCH` (401),
        `ACCOUNT_SUSPENDED` (403), `ACCOUNT_LINK_REQUIRED` (409),
        `SOCIAL_PROVIDER_UNSUPPORTED`, `SOCIAL_EMAIL_UNVERIFIED` (422),
        `SERVICE_UNAVAILABLE` (503, provider down).
      security: []
      x-rate-limit:
        - key: ip
          limit: 30
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          description: Signed in to an existing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '201':
          description: New account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email exists and must be linked first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bondfire.app/errors/account-link-required
                title: You already have an account
                status: 409
                code: ACCOUNT_LINK_REQUIRED
                detail: Sign in with your password to connect Google.
                requestId: req_01J8Z3K5QH
                meta:
                  linkToken: lnk_7d2e…
                  email: a•••••e@example.com
                  existingLoginMethods:
                    - password
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/guest:
    post:
      operationId: startGuestSession
      tags:
        - Auth
      summary: Continue as a guest
      description: |
        Continue as a guest → birthday (Figma 1261:31699, 1261:31730). The
        Figma note makes the birthday mandatory for guests too.

        - Idempotent per install: the same `installationId` gets back its
          existing guest account (`200`) instead of a new one (`201`).
        - Guest tokens get `accountType: guest` and can browse, pick
          interests and register for push. Account-only endpoints return
          `403 GUEST_NOT_ALLOWED`; the app then offers sign-up, which carries
          the guest's data over (see `POST /auth/signup/complete`).
        - Guest accounts unused for 180 days are deleted.

        Errors: `FORBIDDEN` (403, guest mode switched off in `/config`),
        `DATE_OF_BIRTH_INVALID`, `AGE_REQUIREMENT_NOT_MET`,
        `LANGUAGE_UNSUPPORTED` (422).
      security: []
      x-rate-limit:
        - key: ip
          limit: 20
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
      responses:
        '200':
          description: Existing guest for this install, signed in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '201':
          description: New guest created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/token/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Auth
      summary: Swap a refresh token for a new token pair
      description: |
        Called when an access token expires (`401 TOKEN_EXPIRED`) or shortly
        before. Refresh tokens rotate: each one works **once**.

        - **Reuse detection:** presenting an already-used refresh token
          revokes that whole session (`REFRESH_TOKEN_REUSED`) because it may
          have been stolen.
        - **Grace window:** two refreshes racing from the same install within
          30 seconds both get the same new pair, so parallel requests after
          waking from background do not log the user out.
        - The app must serialise refreshes (one in flight at a time).

        Errors: `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_REUSED`,
        `SESSION_REVOKED` (401), `ACCOUNT_SUSPENDED` (403).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens. Replace both stored tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Sign out this session
      description: |
        Revokes the current session. Always returns `204`, even if the tokens
        were already expired or revoked, so the app can clear local state
        unconditionally. The app also unregisters its push token.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-reset:
    post:
      operationId: startPasswordReset
      tags:
        - Auth
      summary: Send a password-reset code
      description: |
        "Reset password" on the password screen. **Always returns `202`** with
        a challenge, whether or not the email has an account, so this cannot
        be used to discover accounts. For unknown emails no mail is sent and
        every code is rejected as `CODE_INCORRECT`.

        Accounts without a password (social-only) receive an email explaining
        how they sign in instead of a code.

        Errors: `EMAIL_INVALID` (422), `SEND_LIMIT_REACHED` (429),
        `EMAIL_DELIVERY_FAILED` (503).
      security: []
      x-rate-limit:
        - key: email
          limit: 5
          window: 24h
        - key: ip
          limit: 20
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: If the account exists, a code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags:
        - Auth
      summary: Set a new password and sign in
      description: |
        Create password screen in the reset flow (Figma 1372:27665), then Home.

        - Revokes **every** other session of the account and clears any login lock.
        - Sends a "your password was changed" email.
        - The new password must differ from the current one (`PASSWORD_REUSED`).

        Errors: `RESET_TOKEN_INVALID`, `RESET_TOKEN_EXPIRED` (401),
        `PASSWORD_POLICY_VIOLATION`, `PASSWORD_COMPROMISED`,
        `PASSWORD_REUSED` (422).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompleteRequest'
      responses:
        '200':
          description: Password changed; signed in on this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      tags:
        - Auth
      summary: Confirm identity before a sensitive action
      description: |
        Returns a 5-minute `reauthToken` for sensitive calls (delete account,
        unlink a login method, set a first password). Social-only users
        re-confirm with a fresh provider credential.

        Wrong password is `422 PASSWORD_INCORRECT` (not 401, which would sign
        the user out). 5 failures lock it like login (`ACCOUNT_LOCKED`, 423).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
        - Account
      summary: Get the signed-in account
      description: |
        Called on launch after restoring tokens. `onboarding.nextStep` tells
        the app which onboarding screen to resume; `consents.termsUpToDate:
        false` means the Terms screen must be shown again. Guests get
        `accountType: guest`.
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The account.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMe
      tags:
        - Account
      summary: Update name, date of birth, gender or language
      description: |
        Used by the birthday, gender and Your Profile (name) screens. Saving a
        field completes its onboarding step automatically.

        - **Age gate:** a date of birth under `minimumAge` (13) is rejected
          with `AGE_REQUIREMENT_NOT_MET`; the account is flagged and the app
          must sign out and show the "not eligible" screen. The rejected date
          is not stored.
        - Age is computed on the user's local date (`device.timeZone`), so a
          birthday today counts; 29 February birthdays turn a year older on
          1 March in non-leap years.
        - Once set, date of birth can be changed only once (typo fix) within
          30 days; after that `DATE_OF_BIRTH_LOCKED` (support can change it).
        - Guests can set `preferredLanguage` only.

        Errors: stale `If-Match` (412), `DATE_OF_BIRTH_LOCKED` (409), `NAME_INVALID`, `DATE_OF_BIRTH_INVALID`,
        `AGE_REQUIREMENT_NOT_MET`, `LANGUAGE_UNSUPPORTED` (422),
        `GUEST_NOT_ALLOWED` (403).
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            examples:
              birthday:
                value:
                  dateOfBirth: '2000-01-12'
              gender:
                value:
                  gender: non_binary
              name:
                value:
                  name: Amelia Jane
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated account.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMe
      tags:
        - Account
      summary: Delete the account
      description: |
        Required in-app by the App Store and Play Store. Needs a fresh
        `X-Reauth-Token`.

        - Accounts are soft-deleted for 30 days (`202`, `pending_deletion`),
          then all personal data and photos are erased. Signing in before
          then cancels the deletion.
        - All sessions are revoked immediately; Apple tokens are revoked with Apple.
        - Guests are deleted immediately (`204`) and need no reauth token.

        Errors: `REAUTH_REQUIRED` (401).
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/password:
    put:
      operationId: changePassword
      tags:
        - Account
      summary: Change (or set a first) password
      description: |
        For accounts that already have a password, `currentPassword` is
        required. Social-only accounts set a first password by omitting
        `currentPassword` and sending `X-Reauth-Token` instead
        (`REAUTH_REQUIRED` otherwise). Other sessions are signed out unless
        `signOutOtherSessions` is `false`.

        Errors: `GUEST_NOT_ALLOWED` (403), `PASSWORD_INCORRECT`,
        `PASSWORD_POLICY_VIOLATION`, `PASSWORD_COMPROMISED`,
        `PASSWORD_REUSED` (422), `ACCOUNT_LOCKED` (423).
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - name: X-Reauth-Token
          in: header
          required: false
          description: Required only when setting a first password (no `currentPassword`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/phone:
    delete:
      operationId: removePhone
      tags:
        - Account
      summary: Remove the phone number
      description: Idempotent. When `/config` → `features.phoneVerificationRequired` is on, the `phone_verified` onboarding step returns to pending.
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/phone/verification:
    post:
      operationId: startPhoneVerification
      tags:
        - Account
      summary: Send an SMS code to add or change the phone number
      description: |
        Enter your phone number screen (Figma 1261:31662) → Enter the code we
        texted you (1261:31680). Verify with `POST /auth/challenges/{id}/verify`.

        - The number is parsed and normalised to E.164 (libphonenumber) using
          the country picked in the app; the verified number replaces any
          previous one only after the code is accepted.
        - Only regions with `phoneSignupSupported: true` in `GET /countries`.
        - Premium-rate and (optionally) VoIP numbers are refused to stop SMS
          fraud (`PHONE_TYPE_NOT_ALLOWED`); sends are also limited per
          country prefix.
        - The same number already verified on this account returns `409 CONFLICT`.

        Errors: `GUEST_NOT_ALLOWED` (403), `PHONE_TAKEN`, `CONFLICT` (409),
        `PHONE_INVALID`, `PHONE_REGION_UNSUPPORTED`,
        `PHONE_TYPE_NOT_ALLOWED` (422), `SEND_LIMIT_REACHED` (429),
        `SMS_DELIVERY_FAILED` (503).
      x-rate-limit:
        - key: phone
          limit: 5
          window: 24h
        - key: account
          limit: 10
          window: 24h
        - key: country-prefix
          limit: 1000
          window: 1h
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/ClientInstallation'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              additionalProperties: false
              properties:
                phoneNumber:
                  $ref: '#/components/schemas/PhoneNumber'
                channel:
                  type: string
                  enum:
                    - sms
                  default: sms
                  description: Reserved for WhatsApp or voice later.
      responses:
        '202':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
