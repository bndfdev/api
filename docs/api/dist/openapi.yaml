      summary: Get an artist's page
      description: |
        The player's Artist page in one call: the profile (name, avatar,
        banner, follower counts and whether the viewer follows them) and the
        releases. An artist is an account that has published at least one
        song (`Song.artist.id`). Guests allowed (`following` is then
        `false`).

        - `releases`: the artist's albums and songs, newest first
          (`releasedAt`, then `id`), at most 200. Hidden items (Hide Content)
          are left out, as on the Profile; followers-only ones are listed
          (play them through `GET /songs/{songId}`, which says whether the
          viewer may). A song on an album is listed too, on its own row.
        - `plays` are counted listens (the rule is under `POST /me/listens`):
          a song's `Song.listens`, an album's the sum of its songs'.
        - `followerCount` and `followingCount` count accounts; `following`
          is the viewer's. Follow with `PUT /me/following/artists/{artistId}`.

        Errors: `NOT_FOUND` (404: no account with that id, or an account
        that has published no song).
