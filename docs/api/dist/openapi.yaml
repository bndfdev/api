        `UNSUPPORTED_MEDIA_TYPE` (415), `UPLOAD_INCOMPLETE`,
        `UPLOAD_PURPOSE_MISMATCH`, `IMAGE_UNREADABLE`, `IMAGE_TOO_SMALL`
